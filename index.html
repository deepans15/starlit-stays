<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Starlit Stays</title>
<style>
  :root{
    --ink:#2b2340; --paper:#fff8ef; --peach:#ffb38a; --rose:#ff7a90; --mint:#6fd3b5;
    --sky1:#7ec8ff; --gold:#ffc94d; --panel:#fffdf8; --line:#e8dccb; --muted:#7a6e86;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1d1830;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  .chip{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;white-space:nowrap}

  /* floating HUD: no boxes, outlined game text over the sky (icons can be replaced by ChatGPT's art/ui files) */
  #hud{position:absolute;left:12px;top:10px;display:flex;gap:22px;align-items:center;z-index:4;pointer-events:none}
  .hg{display:flex;align-items:center;gap:6px}
  .hic{display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 0 rgba(43,35,64,.35))}
  .hic img{width:40px;height:40px;object-fit:contain}
  .hnum{font-size:26px;font-weight:900;color:#ffc94d;-webkit-text-stroke:5px #2b2340;paint-order:stroke fill;letter-spacing:.5px;line-height:1}
  .hnum.small{font-size:20px;-webkit-text-stroke:4px #2b2340}
  .hbadge{position:relative;display:flex;align-items:center;justify-content:center}
  #lvl{position:absolute;top:19px;font-size:16px;font-weight:900;color:#2b2340}
  #xpWrap{width:110px;height:14px;background:#5a4e72;border:3px solid #2b2340;border-radius:8px;overflow:hidden;margin-left:-4px}
  #xpBar{display:block;height:100%;width:0;background:linear-gradient(180deg,#ffe08a,#ffc94d)}
  #hudStars{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:4;pointer-events:none}
  #starIcons{display:flex;gap:1px;font-size:28px;color:#ffc94d;-webkit-text-stroke:2.5px #2b2340;paint-order:stroke fill;line-height:1}
  #starIcons .off{color:#fff8ef;opacity:.85}
  #starIcons img{width:28px;height:28px}
  #speedBtn{position:absolute;right:12px;top:8px;z-index:4;display:flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer;font-size:24px;padding:4px}
  #speedBtn .hic img{width:30px;height:30px}
  #shiftBtn{background:#ff7a90}
  #shiftBtn.open{background:#6fd3b5}
  .dtimer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#2b2340;color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:1px 6px;white-space:nowrap;display:none}
  #shiftBtn.open .dtimer{display:block}
  #stage{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #dock{position:absolute;right:14px;bottom:26px;display:flex;gap:12px;align-items:flex-end;z-index:5}
  body.panelOpen #dock{right:388px}
  body.panelOpen #blockCount{display:none}
  .dbtn{position:relative;border:3px solid var(--ink);border-radius:18px;background:#ffc94d;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .08s}
  .dbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
  .dbtn.big{width:76px;height:76px;border-radius:22px}
  .dbtn.mid{width:60px;height:60px;background:#ffd9b8}
  .dbtn.small{width:48px;height:48px;border-radius:14px;background:#fff}
  .dbtn.on{background:var(--mint)}
  .dbtn .ic{display:flex;align-items:center;justify-content:center}
  .dbtn .ic img{width:70%;height:70%;object-fit:contain}
  .dlab{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 2px 0 var(--ink),0 0 4px rgba(0,0,0,.5)}
  .tabs{display:flex;gap:6px;margin:8px 0 12px}
  #panel.wide{width:min(430px,calc(100% - 20px))}
  body.panelOpen.panelWide #dock{right:458px}
  body.dragOut #panel, body.dragOut #marks{opacity:0;pointer-events:none;transform:translateX(40px)}
  #panel, #marks{transition:opacity .15s, transform .15s}
  #loading{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(#2b2a5c,#45397a);color:#ffe8a8;font-weight:900;transition:opacity .45s}
  #loading.done{opacity:0;pointer-events:none}
  #loading .t{font-size:30px;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  #loading .b{width:min(260px,70vw);height:12px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
  #loading .b i{display:block;height:100%;width:0;background:#ffc94d;border-radius:99px;transition:width .2s}
  #loading .s{font-size:13px;color:#cfc6ef;font-weight:700}
  #marks{position:absolute;display:none;flex-direction:column;gap:6px;z-index:5}
  #marks button{border:3px solid var(--line);border-right:none;background:#f3ece2;border-radius:14px 0 0 14px;width:64px;padding:8px 2px;font-weight:800;font-size:10.5px;cursor:pointer;color:#7a6e86;line-height:1.15;text-align:center;box-shadow:-4px 4px 10px rgba(0,0,0,.18);transition:transform .12s,background .12s,width .12s}
  #marks button .e{display:block;font-size:19px;margin-bottom:2px}
  #marks button.on{background:var(--panel);color:var(--ink);width:72px;transform:translateX(-8px);border-color:var(--line)}
  #marks button.ltd:not(.on){background:#ffe6b8;color:#b5651d}
  #marks.slim button{width:58px;font-size:9.5px;padding:7px 1px}
  #marks.slim button.on{width:62px;transform:translateX(-4px)}
  #marks.top{flex-direction:row}
  #marks.top button{border:3px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;width:auto;flex:1;box-shadow:0 -3px 8px rgba(0,0,0,.15)}
  #marks.top button.on{width:auto;transform:translateY(-6px)}
  .bsec{scroll-margin-top:6px}
  .bsec h3.big{margin:6px 0 8px;font-size:15px;border-bottom:2px dashed var(--line);padding-bottom:4px}
  .tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 4px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}  #hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;display:none;gap:10px;align-items:center;z-index:5;white-space:nowrap}
  #hint button{border:none;background:var(--rose);color:#fff;border-radius:999px;padding:4px 10px;font-weight:800;cursor:pointer}
  #goalsBox{cursor:pointer;position:absolute;left:10px;top:64px;background:rgba(255,253,248,.94);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:12px;max-width:240px;z-index:4}
  #goalsBox b{font-size:12px}
  #goalsBox .g{margin-top:4px;display:flex;justify-content:space-between;gap:8px}
  #goalsBox .r{color:#b07a00;font-weight:800;white-space:nowrap}
  #goalsBox .next{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--muted)}
  #panel{position:absolute;right:10px;top:10px;bottom:10px;width:min(360px,calc(100% - 20px));background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px;overflow:auto;display:none;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #panel h2{margin:0 0 4px;font-size:18px;padding-right:24px}
  #panel h3{margin:14px 0 6px;font-size:14px}
  #panel .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
  #panel .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
  .item{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;background:#fff}
  .item .sw{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
  .item .sw img{max-width:34px;max-height:34px}
  .item .info{flex:1;font-size:13px}
  .item .info b{font-size:14px}
  .item .meta{color:var(--muted);font-size:12px}
  .item .btns{display:flex;flex-direction:column;gap:4px}
  .btn{border:none;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;background:var(--mint);color:#173b31;white-space:nowrap}
  .btn[disabled]{background:#e6ddd0;color:#9c917f;cursor:not-allowed}
  .btn.warn{background:var(--rose);color:#fff}
  .btn.alt{background:#e9e1ff;color:#3b2f7a}
  .cat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bcard{position:relative;touch-action:pan-y;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;text-align:center}
  .bcard:hover{border-color:#f19a6c}
  .bcard.locked{cursor:not-allowed;opacity:.75}
  .bcard.poor{opacity:.6}
  .thumb{touch-action:none;cursor:grab;height:64px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
  .thumb .shape{border:3px solid var(--ink);border-top-width:6px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .bcard .nm{font-weight:800;font-size:13px}
  .bcard .pr{font-weight:900;color:#b07a00;font-size:14px}
  .bcard .ea{color:var(--muted);font-size:11px}
  .lock{position:absolute;right:6px;top:6px;background:#ffc94d;border:2px solid var(--ink);border-radius:8px;font-weight:900;font-size:12px;padding:1px 6px}
  .colors{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .colors span{width:28px;height:28px;border-radius:8px;cursor:pointer;border:3px solid transparent}
  .colors span.on{border-color:var(--ink)}
  .meter{height:10px;background:#eee3d3;border-radius:6px;overflow:hidden;margin:6px 0 12px}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,#ff8a7a,#ffc94d,#6fd3b5)}
  #blockCount{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;text-shadow:0 2px 0 #2b2340,0 0 6px rgba(0,0,0,.4);pointer-events:none;z-index:3}
  #helper{position:absolute;left:14px;bottom:14px;display:none;align-items:flex-end;gap:8px;z-index:6;pointer-events:none;max-width:min(340px,90%)}
  #helperPic{width:72px;height:104px;flex:none;display:flex;align-items:flex-end;justify-content:center;font-size:54px}
  #helperPic img{width:72px;height:104px;object-fit:contain}
  #helperBubble{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;box-shadow:0 6px 0 rgba(43,35,64,.25);pointer-events:auto;position:relative}
  #helperBubble button{display:block;margin-top:8px;border:none;background:var(--mint);border-radius:10px;padding:5px 10px;font-weight:800;cursor:pointer}
  #helperArrow{position:fixed;z-index:8;font-size:34px;pointer-events:none;display:none;animation:bob 0.8s ease-in-out infinite alternate;filter:drop-shadow(0 3px 0 rgba(43,35,64,.4))}
  @keyframes bob{from{transform:translate(-50%,0)}to{transform:translate(-50%,-10px)}}
  #toasts{position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:7;pointer-events:none}
  .toast{background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;animation:fade 3.2s forwards;text-align:center}
  @keyframes fade{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  #modal{position:fixed;inset:0;background:rgba(20,15,35,.6);display:none;align-items:center;justify-content:center;z-index:10}
  #modal .card{background:var(--panel);border-radius:20px;padding:22px;width:min(400px,92%);text-align:center;max-height:90%;overflow:auto}
  #modal input{width:100%;font-size:18px;padding:10px;border-radius:12px;border:2px solid var(--line);margin:12px 0;text-align:center}
  .lvlBig{font-size:46px;font-weight:900;color:#e8a400;margin:4px 0;text-shadow:0 3px 0 #2b2340}
  .unlock{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;margin:6px 0;font-size:14px}
  .unlock .ic{font-size:22px;width:30px;text-align:center}
  @media (max-width:640px){
    #blockCount{display:none} body.panelOpen #dock{display:none}
    #helper{top:84px;bottom:auto} #toasts{top:auto;bottom:112px} .toast{font-size:12px;padding:6px 12px} #helperPic{width:48px;height:70px} #helperPic img{width:48px;height:70px} #helper{max-width:calc(100% - 16px)}
    #dock{gap:8px;right:8px} .dbtn.big{width:64px;height:64px} .dbtn.mid{width:52px;height:52px} .dbtn.small{width:42px;height:42px} 
    #goalsBox{display:none} #hud{gap:10px;left:8px} .hnum{font-size:19px;-webkit-text-stroke:4px #2b2340} .hnum.small{font-size:16px} .hic svg{width:28px;height:28px} #xpWrap{width:60px} #lvl{top:13px;font-size:12px} #hudStars{top:46px} #starIcons{font-size:20px} #speedBtn{top:4px}
    /* phones: the menu slides in from the right side, leaving room on the left for the bookmarks and a strip of the hotel */
    #panel, #panel.wide{left:auto;right:4px;top:70px;bottom:4px;height:auto;width:calc(100% - 78px);padding:10px}
    #panel .cat{gap:6px}
    #panel .bcard{padding:6px 4px}
    #panel .bcard .nm{font-size:12px}
    #panel .bcard .ea{font-size:10px}
  }
</style>
</head>
<body>
<div id="loading"><div class="t">★ Starlit Stays ★</div><div class="b"><i id="loadBar"></i></div><div class="s">Opening the doors…</div></div>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="hg" title="Coins"><span class="hic" data-art="ui/coin"><svg viewBox="0 0 48 48" width="36" height="36"><circle cx="24" cy="24" r="19" fill="#ffc94d" stroke="#2b2340" stroke-width="3.5"/><circle cx="24" cy="24" r="12" fill="none" stroke="#e8a400" stroke-width="3"/><path d="M19 17h8a4 4 0 0 1 0 8h-7m0 0h8a4 4 0 0 1 0 8h-9" fill="none" stroke="#2b2340" stroke-width="0"/></svg></span><span class="hnum" id="coins">0</span></div>
      <div class="hg" title="Level"><span class="hbadge"><span class="hic" data-art="ui/level"><svg viewBox="0 0 48 48" width="46" height="46"><path d="M6 24 24 7l18 17v18a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z" fill="#ffc94d" stroke="#2b2340" stroke-width="3.5" stroke-linejoin="round"/><path d="M2 26 24 5l22 21" fill="none" stroke="#2b2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="lvl">1</span></span><span id="xpWrap"><span id="xpBar"></span></span></div>
      <div class="hg" title="Blocks used / available"><span class="hic" data-art="ui/blocks"><svg viewBox="0 0 48 48" width="30" height="30"><rect x="6" y="10" width="36" height="28" rx="3" fill="#ff9f68" stroke="#2b2340" stroke-width="3.5"/><path d="M6 24h36M18 10v14M30 24v14" stroke="#2b2340" stroke-width="3"/></svg></span><span class="hnum small" id="blocks">0/12</span></div>
    </div>
    <div id="hudStars" title="Star rating (up to 7)"><span id="starIcons"></span><span class="hnum small" id="starNum">1</span></div>
    <button id="speedBtn" title="Game speed"><span class="hic" data-art="ui/speed">⏩</span><span class="hnum small" id="speedTxt">2×</span></button>
    <div id="hint"><span id="hintText"></span><button id="hintCancel">Done</button></div>
    <div id="goalsBox"></div>
    <div id="marks"></div>
    <div id="panel"></div>
    <div id="toasts"></div>
    <div id="blockCount"></div>
    <div id="dock">
      <button class="dbtn small" id="btnGoals" title="Goals"><span class="ic" data-art="ui/goals"><svg viewBox="0 0 48 48" width="30" height="30"><circle cx="24" cy="24" r="19" fill="#fff" stroke="#2b2340" stroke-width="3"/><circle cx="24" cy="24" r="12" fill="#ff7a90" stroke="#2b2340" stroke-width="3"/><circle cx="24" cy="24" r="5" fill="#fff" stroke="#2b2340" stroke-width="3"/></svg></span><span class="dlab">Goals</span></button>
      <button class="dbtn small" id="btnRanks" title="Leaderboard"><span class="ic" data-art="ui/leaderboard"><svg viewBox="0 0 48 48" width="30" height="30"><path d="M14 8h20v8a10 10 0 0 1-20 0z" fill="#ffc94d" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/><path d="M14 11H7v3a7 7 0 0 0 7 7M34 11h7v3a7 7 0 0 1-7 7" fill="none" stroke="#2b2340" stroke-width="3"/><path d="M24 26v8M16 40h16l-2-6H18z" fill="#c8915f" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/></svg></span><span class="dlab">Ranks</span></button>
      <button class="dbtn small" id="btnMenu" title="Settings"><span class="ic" data-art="ui/settings"><svg viewBox="0 0 48 48" width="30" height="30"><circle cx="24" cy="24" r="15" fill="#b8bec8" stroke="#2b2340" stroke-width="10" stroke-dasharray="6 5.8"/><circle cx="24" cy="24" r="14" fill="#dfe3ea" stroke="#2b2340" stroke-width="3"/><circle cx="24" cy="24" r="6" fill="#fff" stroke="#2b2340" stroke-width="3"/></svg></span><span class="dlab">Settings</span></button>
      <button class="dbtn mid" id="shiftBtn" title="Open your hotel"><span class="ic" data-art="ui/open"><svg viewBox="0 0 48 48" width="34" height="34"><path d="M24 8c-8 0-12 6-12 14v8l-4 6h32l-4-6v-8c0-8-4-14-12-14z" fill="#ffc94d" stroke="#2b2340" stroke-width="3.5" stroke-linejoin="round"/><circle cx="24" cy="40" r="4" fill="#2b2340"/><circle cx="24" cy="6" r="3" fill="#2b2340"/></svg></span><span class="dlab" id="shiftLab">Open</span><span class="dtimer" id="shiftTimer"></span></button>
      <button class="dbtn mid" id="btnExpand" title="Expand"><span class="ic" data-art="ui/expand"><svg viewBox="0 0 48 48" width="32" height="32"><rect x="12" y="12" width="24" height="24" rx="3" fill="#ffb38a" stroke="#2b2340" stroke-width="3"/><path d="M4 12V4h8M44 12V4h-8M4 36v8h8M44 36v8h-8" fill="none" stroke="#2b2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="dlab">Expand</span></button>
      <button class="dbtn big" id="btnBuild" title="Build"><span class="ic" data-art="ui/build"><svg viewBox="0 0 48 48" width="40" height="40"><g transform="rotate(-40 24 24)"><rect x="21" y="16" width="7" height="30" rx="3" fill="#c8915f" stroke="#2b2340" stroke-width="3"/><path d="M9 8h26a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4z" fill="#b8bec8" stroke="#2b2340" stroke-width="3"/><rect x="9" y="11" width="8" height="8" rx="2" fill="#dfe3ea"/></g></svg></span><span class="dlab">Build</span></button>
    </div>
    <div id="helper"><div id="helperPic"></div><div id="helperBubble"><span id="helperText"></span><button id="helperOk">OK</button></div></div>
  </div>
</div>
<div id="modal"><div class="card" id="modalCard"></div></div>
<div id="helperArrow">👇</div>

<script src="art/manifest.js"></script>
<script src="art/items.js"></script>
<script>
"use strict";
/* ============================================================
   Starlit Stays — browser prototype
   An original hotel-building game. Art by ChatGPT (art/ folder),
   game code by Claude. Not affiliated with Electronic Arts or Playfish.
   ============================================================ */

// Every new build starts a fresh hotel (saves from older builds are ignored).
const BUILD = '0.31';
// Save slot stays fixed so updates keep the player's hotel. Only change SAVE_VERSION when a reset is really needed.
const SAVE_VERSION = '0.17';
const SAVE_KEY = 'starlit-stays-build-' + SAVE_VERSION;
// The player's profile (hotel name, whether they've seen the intro) is kept across builds, so beta testers
// aren't asked for their hotel name after every update. Only the hotel itself resets.
const PROFILE_KEY = 'starlit-stays-profile';
const SPEEDS = [1, 2, 3];
function gameSpeed(){ const v = loadProfileCached().speed; return SPEEDS.includes(v) ? v : 2; }
let _profCache = null;
function loadProfileCached(){ if(!_profCache) _profCache = loadProfile(); return _profCache; }
function loadProfile(){
  let p = {};
  try{ p = JSON.parse(localStorage.getItem(PROFILE_KEY)) || {}; }catch(e){}
  if(!p.name){
    // players from builds before the profile existed: borrow the name from their newest old save
    try{
      for(const k of Object.keys(localStorage)){
        if(!k.startsWith('starlit-stays-build-') || k===SAVE_KEY) continue;
        const old = JSON.parse(localStorage.getItem(k));
        if(old && old.name){ p.name = old.name; p.seenHelp = true; }
      }
    }catch(e){}
  }
  return p;
}

const ITEMS = {};
(function buildItems(){
  const norm = (d) => {
    if(!d || typeof d.id !== 'string' || !/^[a-z0-9_]{1,40}$/.test(d.id)) return null;
    const num = (v, def, lo, hi) => { v = Number(v); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def; };
    const zone = ['floor','wall','ceiling','bed'].includes(d.zone) ? d.zone : 'floor';
    const rooms = Array.isArray(d.rooms) && d.rooms.length ? d.rooms.filter(k=>['guest','amenity','lobby'].includes(k)) : (zone==='bed' ? ['guest'] : ['guest','amenity','lobby']);
    return { id:d.id, name:String(d.name||d.id).slice(0,30), zone,
      w: num(d.width,64,8,320)/2, h: num(d.height,64,8,320)/2,
      cost: Math.round(num(d.cost,100,0,100000)), decor: Math.round(num(d.decor,3,0,60)), lvl: Math.round(num(d.level,1,1,60)),
      rooms, emoji: typeof d.emoji==='string' && d.emoji && !d.emoji.includes('?') ? d.emoji.slice(0,4) : '✨', back: !!d.back || d.id.includes('rug') };
  };
  for(const d of ITEM_DEFAULTS){ const n = norm(d); if(n) ITEMS[n.id] = n; }
  const extra = Array.isArray(window.STARLIT_ITEMS) ? window.STARLIT_ITEMS : [];
  for(const d of extra){ const n = norm(Object.assign({}, ITEMS[d && d.id] ? ITEM_DEFAULTS.find(x=>x.id===d.id) : {}, d)); if(n) ITEMS[n.id] = n; }
})();
/* ---------------- themes ----------------
   ChatGPT adds themes without code changes:
   - a room style:   art/rooms/<theme>_<roomtype>.svg  (e.g. rooms/love_lounge.svg)  -> a style the player can pick for that room
   - a collection:   3 or more furniture ids that start with the same "<theme>_"     -> grouped in the shop, with a set bonus */
const ROOM_STYLES = {};   // roomtype -> [theme, ...]
const COLLECTIONS = {};   // theme -> [item ids]
(function findThemes(){
  const m = window.STARLIT_ART || {};
  for(const key of Object.keys(m)){
    const mm = /^rooms\/([a-z0-9]+)_([a-z0-9]+)$/.exec(key);
    if(mm && ROOMS[mm[2]] && mm[2]!==mm[1]){ (ROOM_STYLES[mm[2]] = ROOM_STYLES[mm[2]] || []).push(mm[1]); }
  }
  const byPrefix = {};
  for(const id of Object.keys(ITEMS)){ const p = id.split('_')[0]; if(id.includes('_')) (byPrefix[p] = byPrefix[p] || []).push(id); }
  const roomThemes = new Set(Object.values(ROOM_STYLES).flat());
  for(const [p, ids] of Object.entries(byPrefix)) if(ids.length >= 3 || roomThemes.has(p)) COLLECTIONS[p] = ids;
})();
const themeName = t => t.charAt(0).toUpperCase() + t.slice(1);
const themeIcon = t => ({love:'💕', halloween:'🎃', winter:'❄️', christmas:'🎄', spring:'🌸', summer:'🏖️', beach:'🏖️', space:'🚀', garden:'🌿', retro:'📻'})[t] || '✨';
const STYLE_COST = 250;
function collectionBonus(r){
  const out = [];
  for(const [t, ids] of Object.entries(COLLECTIONS)){
    const n = (r.items||[]).filter(it=>ids.includes(it.id)).length;
    if(n >= 3) out.push({theme:t, n, bonus: 3*n});
  }
  return out;
}

/* ---------------- art ----------------
   Art files live in art/ and are listed in art/manifest.js. Anything missing falls back to shapes drawn in code. */
const ART = {};
// all art is loaded behind the loading screen, so the game never flashes old or placeholder pictures.
// ?v=BUILD makes browsers fetch fresh art after each update instead of showing old cached copies.
const artReady = new Promise(done => {
  const list = Object.entries(window.STARLIT_ART || {});
  let left = list.length; const bar = document.getElementById('loadBar');
  const tick = () => { left--; if(bar) bar.style.width = Math.round(100*(list.length-left)/Math.max(1,list.length))+'%'; if(left<=0) done(); };
  if(!left) done();
  for(const [key, file] of list){
    const img = new Image();
    img.onload = () => { ART[key] = img; tick(); };
    img.onerror = tick;
    img.src = 'art/' + file + '?v=' + BUILD;
  }
  setTimeout(done, 8000);   // slow connection: start anyway, late pictures pop in when they arrive
});
const art = k => ART[k] || null;
const GUEST_SKINS = (()=>{ let n=0; while((window.STARLIT_ART||{})['chars/guest_'+(n+1)]) n++; return Math.max(n,6); })();   // grows as ChatGPT adds guest_N art
function sprite(key, x, y, w, h, flip){
  const img = art(key); if(!img) return false;
  if(flip){ ctx.save(); ctx.translate(x+w, y); ctx.scale(-1,1); ctx.drawImage(img, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(img, x, y, w, h);
  return true;
}
/* Animations: extra frames named <base>_<anim>_<n>, e.g. chars/guest_1_walk_1 … _walk_4.
   animFrame() returns the frame to show now, or the base key when the frames aren't drawn yet. */
function animFrame(base, anim, count, fps, t){
  const n = 1 + Math.floor((t===undefined ? time : t) * fps) % count;
  const k = `${base}_${anim}_${n}`;
  return art(k) ? k : base;
}

function migrate(s){
  if(!s || s.build !== SAVE_VERSION) return null;
  s.rooms = (s.rooms||[]).filter(r=>ROOMS[r.type]);
  for(const r of s.rooms){ r.items = (r.items||[]).filter(it=>ITEMS[it.id]); for(const it of r.items) itemUid = Math.max(itemUid, (it.u||0)+1); }
  s.storage = s.storage || []; s.inv = s.inv || {};
  return s;
}
function load(){

  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
  if(raw){ try{ S = migrate(JSON.parse(raw)); }catch(e){ S=null; } }
  if(!S){ S = freshState(); return false; }
  const now = Date.now(), openUntil = Math.min(now, S.shiftEnd||0), away = (openUntil - (S.savedAt||now))/1000;
  if(away > 30 && S.rate > 0){

    if(earned>0){ S.coins += earned; S.xp += Math.round(earned*0.2); setTimeout(()=>toast(`While you were away your staff earned 🪙${earned}`),600); }
  }
  return true;
}

/* ---------------- cloud save (per player, private) ---------------- */
const cloud = {ref:null, busy:false, last:''};
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc('data/users/' + uid + '/' + CLOUD_DOC);
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}), 10000))]);
    if(snap && snap.exists){
      const d = snap.data();
      if(d && typeof d.json === 'string'){
        const remote = migrate(JSON.parse(d.json));
        if(remote && (d.savedAt||0) > (S.savedAt||0) + 2000){
          S = remote; S.savedAt = d.savedAt; guests = []; lastTop=''; checkPokeDay(); renderGoalsBox(); closeModal(); closePanel();
          try{ localStorage.setItem(SAVE_KEY, serialize()); }catch(e){}
          toast('☁️ Loaded your cloud save');
        }
      }
    }
    cloud.ref = ref;
    try{
      cloud.profile = db.doc('data/users/' + uid + '/profile');
      const ps = await cloud.profile.get();
      const pd = ps && ps.exists ? ps.data() : null;
      if(pd && pd.name && !loadProfile().name){ saveProfile({name: pd.name, seenHelp: true}); if(S.name !== pd.name){ S.name = pd.name; save(); closeModal(); lastTop=''; } }
      else if(S.name && (!pd || pd.name !== S.name)) await cloud.profile.set({name: S.name});
    }catch(e){}
    cloudSave();
  }catch(e){ /* cloud save unavailable: browser save still works */ }
}
async function cloudSave(){
  if(!cloud.ref || cloud.busy || !S.name) return;
  const json = serialize().replace(/"savedAt":\d+,?/,'');
  if(json === cloud.last) return;
  cloud.busy = true;
  try{ await cloud.ref.set({json: serialize(), savedAt: S.savedAt || Date.now()}); cloud.last = json; }
  catch(e){ if(e && (e.code==='invalid_argument' || e.code==='revoked' || e.code==='not_granted' || e.code==='quota_exceeded')) cloud.ref = null; }
  cloud.busy = false;
}

/* ---------------- helpers ---------------- */
const plot = () => ({w:WORLD_C, h:WORLD_F});
const blocksMax = () => BLOCK_TIERS[S.plot].blocks;
const blocksUsed = (ignoreId) => S.rooms.reduce((a,r)=> a + (r.id===ignoreId ? 0 : ROOMS[r.type].w*hOf(r.type)), 0);
const count = t => S.rooms.filter(r=>r.type===t).length;
const cellsOf = r => ROOMS[r.type].w * hOf(r.type);
const decorCapacity = r => 12 * cellsOf(r);
function decorPoints(r){
  let p = 0;
  if(r.wall) p += 2*cellsOf(r);
  if(r.floor) p += 2*cellsOf(r);
  for(const it of (r.items||[])) p += ITEMS[it.id] ? ITEMS[it.id].decor : 0;
  for(const c of collectionBonus(r)) p += c.bonus;   // matching sets are worth more
  if(r.style) p += 2*cellsOf(r);                      // a themed room style counts as decor too
  return p;
}
function decorPct(r){
  const k = ROOMS[r.type].kind;
  if(k==='service') return 0;
  return Math.min(1, decorPoints(r)/decorCapacity(r));
}
const hasBed = r => (r.items||[]).some(it=>ITEMS[it.id] && ITEMS[it.id].zone==='bed');
const xpFor = n => n<=1 ? 0 : Math.floor(25*Math.pow(n-1,1.6));
function level(){ let n=1; while(S.xp >= xpFor(n+1)) n++; return n; }
const isOpen = () => Date.now() < S.shiftEnd;
function stars(){
  const g = S.rooms.filter(r=>ROOMS[r.type].kind==='guest');
  const avgDecor = g.length ? g.reduce((a,r)=>a+decorPct(r),0)/g.length : 0;
  const types = new Set(S.rooms.filter(r=>ROOMS[r.type].kind==='amenity').map(r=>r.type)).size;
  const cleanable = S.rooms.filter(r=>ROOMS[r.type].kind==='guest' || ROOMS[r.type].kind==='amenity');
  const clean = cleanable.length ? cleanable.filter(r=>!r.dirty).length/cleanable.length : 1;
  const lobby = lobbyRoom(), lobbyDecor = lobby ? decorPct(lobby) : 0;
  const score = 1 + 2.2*avgDecor + 1.4*Math.min(types,6)/6 + 1.0*S.sat + 0.8*clean + 0.6*lobbyDecor;
  return Math.max(1, Math.min(MAX_STARS, Math.round(score*2)/2));
}
const starMult = () => 0.6 + 0.15*stars();
function roomRect(r){
  const def = ROOMS[r.type], h = hOf(r.type);
  return {x: BX + r.c*CELL, y: TOP + (plot().h - r.f - h)*FLOOR, w: def.w*CELL, h: h*FLOOR};
}
const lobbyRoom = () => S.rooms.find(r=>r.type==='lobby');
const ease = t => 1 - Math.pow(1-t, 3);
function visRect(r){
  if(r.ghost) return {x:r.ghost.x, y:r.ghost.y, w:ROOMS[r.type].w*CELL, h:hOf(r.type)*FLOOR};
  const q = roomRect(r), d = ui.drag;
  if(d && d.moved && d.room.id===r.id){ q.x += d.px - d.wx0; q.y += d.py - d.wy0; }
  else if(r.anim){ const k = 1 - ease(Math.min(1, r.anim.t/0.2)); q.x += r.anim.dx*k; q.y += r.anim.dy*k; }
  return q;
}
const groundY = () => TOP + plot().h*FLOOR;
const worldW = () => BX + plot().w*CELL + 90;
function buildBounds(pad){
  pad = pad===undefined ? 1.5 : pad;
  let c0 = WORLD_C, c1 = 0, f1 = 1;
  for(const r of S.rooms){ c0 = Math.min(c0, r.c); c1 = Math.max(c1, r.c + ROOMS[r.type].w); f1 = Math.max(f1, r.f + hOf(r.type)); }
  if(c0 > c1){ c0 = 5; c1 = 8; }
  const x0 = BX + (c0 - pad)*CELL, x1 = BX + (c1 + pad)*CELL;
  const y0 = TOP + (WORLD_F - f1 - Math.max(1, pad))*FLOOR - 40, y1 = groundY() + SIDEWALK;
  return {x0, x1, y0, y1, c0, c1, f1};
}
const streetX = () => buildBounds().x1 + 20;
const lobbyLiftX = () => { const l = lobbyRoom(); return l ? BX + l.c*CELL + ROOMS.lobby.w*CELL - 34 : BX; };
const worldH = () => groundY() + SIDEWALK;
function shiftCost(sh){ return Math.round(sh.cost * (1 + 0.1*(level()-1))); }
function coverage(){
  const cap = S.rooms.filter(r=>r.type==='closet').length * ROOMS.closet.capacity;
  const list = S.rooms.filter(r=>ROOMS[r.type].kind==='guest' || ROOMS[r.type].kind==='amenity').sort((a,b)=>a.id-b.id);
  return {cap, covered:new Set(list.slice(0,cap).map(r=>r.id)), total:list.length};
}
// which cells are taken, optionally pretending one room is gone and another is somewhere else
function occupancy(ignoreId, extra){
  const occ = new Set();
  for(const r of S.rooms){ if(r.id===ignoreId) continue; const d = ROOMS[r.type]; for(let i=0;i<d.w;i++) for(let j=0;j<hOf(r.type);j++) occ.add((r.f+j)+','+(r.c+i)); }
  if(extra){ const d = ROOMS[extra.type]; for(let i=0;i<d.w;i++) for(let j=0;j<hOf(extra.type);j++) occ.add((extra.f+j)+','+(extra.c+i)); }
  return occ;
}
// a room stands on the ground, or every cell under it belongs to another room
function isSupported(type, f, c, occ){
  if(f===0) return true;
  // like the original: one block underneath is enough, the rest of a wide room can hang over the edge
  for(let i=0;i<ROOMS[type].w;i++) if(occ.has((f-1)+','+(c+i))) return true;
  return false;
}
// would any other room be left floating if room `id` moved to (f,c) or was removed (f = null)?
function strandsOthers(id, type, f, c){
  const extra = f===null ? null : {type, f, c};
  const occ = occupancy(id, extra);
  for(const r of S.rooms){ if(r.id===id) continue; if(!isSupported(r.type, r.f, r.c, occ)) return r; }
  return null;
}
function placeProblem(type, f, c, ignoreId){
  const def = ROOMS[type], p = plot(), h = hOf(type);
  if(f<0 || c<0 || c+def.w>p.w || f+h>p.h) return "That's outside the building area";
  if(def.ground && f!==0) return `The ${def.name.toLowerCase()} has to be on the ground floor`;
  if(def.minFloor && f<def.minFloor) return `${def.name} needs to start on floor ${def.minFloor+1} or higher`;
  for(const r of S.rooms){
    if(r.id===ignoreId) continue;
    const o = ROOMS[r.type], oh = hOf(r.type);
    if(c < r.c+o.w && r.c < c+def.w && f < r.f+oh && r.f < f+h) return `That spot overlaps the ${o.name}`;
  }
  if(blocksUsed(ignoreId) + def.w*h > blocksMax()) return `Not enough blocks (${blocksUsed(ignoreId)}/${blocksMax()} used). Expand to get more.`;
  if(!isSupported(type, f, c, occupancy(ignoreId))) return 'Rooms need at least one block under them: the ground or another room';
  if(ignoreId!==undefined){ const s2 = strandsOthers(ignoreId, type, f, c); if(s2) return `The ${ROOMS[s2.type].name} above would have nothing to stand on`; }
  return null;
}
const canPlace = (type,f,c,ignoreId) => !placeProblem(type,f,c,ignoreId);
function addCoins(n, x, y, label){
  S.coins += n;
  if(isOpen()) rateLog.push([time, n]);
  if(x!==undefined) floats.push({x,y,t:0,text:(label||'+🪙')+n});
}
function addXP(n){
  S.xp += n;
  const lv = level();
  if(lv > (S.seenLevel||1)){ const from = S.seenLevel||1; S.seenLevel = lv; levelUp(from+1, lv); }
}
let rateLog = [];
function updateRate(){
  rateLog = rateLog.filter(e=>time-e[0] < 120);
  const sum = rateLog.reduce((a,e)=>a+e[1],0);
  S.rate = rateLog.length ? sum/120 : S.rate*0.999;
}
function today(){ return new Date().toDateString(); }
function checkPokeDay(){ if(S.pokeDay!==today()){ S.pokeDay=today(); S.pokes=20; } }

/* ---------------- levelling ---------------- */
function unlocksAt(lv){
  const out = [];
  for(const [k,d] of Object.entries(ROOMS)) if(d.lvl===lv) out.push({ic: d.icon || (d.kind==='guest'?'🛏️':'🧺'), t:`New room: ${d.name}`, art:'rooms/'+k});
  for(const it of Object.values(ITEMS)) if(it.lvl===lv) out.push({ic: it.emoji, t:`New furniture: ${it.name}`, art:'decor/'+it.id});
  for(const [k,g] of Object.entries(GUEST_TYPES)) if(g.lvl===lv) out.push({ic: k==='vip'?'👑':'💼', t:`New guests: ${g.name}` + (k==='vip'?' (pay double, want rooms at least 70% decorated)':' (pay more, always want an amenity)')});
  const p = BLOCK_TIERS.find(p=>p.lvl===lv); if(p) out.push({ic:'🧱', t:`Expansion available: ${p.blocks} blocks`});
  return out;
}
const levelReward = lv => 100*lv;
function levelUp(fromLv, toLv){
  let coins = 0, gifts = [], unlocks = [];
  for(let lv=fromLv; lv<=toLv; lv++){
    coins += levelReward(lv);
    unlocks.push(...unlocksAt(lv));
    if(lv % 5 === 0){
      const pool = Object.values(ITEMS).filter(it=>it.lvl<=lv && it.zone!=='bed').sort((a,b)=>b.cost-a.cost).slice(0,4);
      const gift = pool[Math.floor(Math.random()*pool.length)];
      if(gift){ S.inv[gift.id] = (S.inv[gift.id]||0)+1; gifts.push(gift); }
    }
  }
  S.coins += coins;
  burstConfetti();
  const next = nextUnlock();
  modal(`<div style="font-weight:800;color:#7a6e86">LEVEL UP!</div><div class="lvlBig">Level ${toLv}</div>
    <div class="unlock"><span class="ic">🪙</span><span>Reward: <b>${coins.toLocaleString()} coins</b></span></div>
    ${gifts.map(g=>`<div class="unlock"><span class="ic">🎁</span><span>Gift: <b>${g.name}</b> (in your furniture inventory)</span></div>`).join('')}
    ${unlocks.map(u=>`<div class="unlock"><span class="ic">${u.ic}</span><span>${u.t}</span></div>`).join('')}
    ${next ? `<div style="color:#7a6e86;font-size:13px;margin-top:10px">Next: ${next.t} at level ${next.lv}</div>` : ''}
    <button class="btn" style="margin-top:14px" onclick="closeModal()">Awesome!</button>`);
  save();
}
function nextUnlock(){
  const lv = level();
  for(let n=lv+1; n<=60; n++){ const u = unlocksAt(n); if(u.length) return {lv:n, t:u[0].t.replace(/^New (room|furniture|guests): /,'')}; }
  return null;
}
function burstConfetti(){
  const dpr = window.devicePixelRatio||1, W = cv.width/dpr;
  for(let i=0;i<120;i++) confetti.push({x:W/2 + (Math.random()-0.5)*80, y:120, vx:(Math.random()-0.5)*520, vy:-200-Math.random()*380, r:Math.random()*6.28, vr:(Math.random()-0.5)*10, t:0, c:['#ffc94d','#ff7a90','#6fd3b5','#7ec8ff','#c77dff'][i%5]});
}

/* ---------------- guests ---------------- */
function laneY(){ return groundY(); }
function queue(){ return guests.filter(g=>g.state==='queue' || g.state==='walkIn'); }
function deskX(){ const l = lobbyRoom(); return BX + (l ? l.c : 1)*CELL + 34; }
function liftX(){ return lobbyLiftX(); }
function guestRoomCount(){ return S.rooms.filter(r=>ROOMS[r.type].kind==='guest' && hasBed(r)).length; }
function spawnInterval(){ return Math.max(1.2, 22/(guestRoomCount()+1)) * (1.15 - stars()*0.07); }
function pickGuestType(){
  const lv = level(), roll = Math.random();
  if(lv >= GUEST_TYPES.vip.lvl && roll < 0.12) return 'vip';
  if(lv >= GUEST_TYPES.business.lvl && roll < 0.35) return 'business';
  return 'regular';
}
function spawnGuest(){
  const q = queue();
  if(q.length >= Math.min(8, guestRoomCount()+1)) return;
  const type = pickGuestType(), gt = GUEST_TYPES[type];
  const unlockedAmen = AMENITY_TYPES.filter(t=>ROOMS[t].lvl <= level());
  const wantsSomething = gt.alwaysWants || Math.random()<0.55;
  const want = wantsSomething && unlockedAmen.length ? unlockedAmen[Math.floor(Math.random()*unlockedAmen.length)] : null;
  guests.push({id:gid++, state:'walkIn', x:streetX(), y:laneY(), qi:q.length, skin:1+Math.floor(Math.random()*GUEST_SKINS), dir:-1,
    type, color:GUEST_COLORS[Math.floor(Math.random()*GUEST_COLORS.length)], hat:Math.random()<0.4,
    want, wait:0, inspector: type==='regular' && Math.random()<0.04, room:null, timer:0, alpha:1, poked:false});
}
function freeGuestRoom(g){
  const need = GUEST_TYPES[g.type].needsDecor || 0;
  const opts = S.rooms.filter(r=>ROOMS[r.type].kind==='guest' && !r.guest && !r.reserved && !r.dirty && hasBed(r) && decorPct(r) >= need);
  if(!opts.length) return null;
  opts.sort((a,b)=> (ROOMS[b.type].pay*(0.6+0.9*decorPct(b))) - (ROOMS[a.type].pay*(0.6+0.9*decorPct(a))));
  return opts[0];
}
function amenityFor(type){ return S.rooms.find(r=>r.type===type && !r.dirty && (r.users||0) < ROOMS[r.type].slots); }
function moveTo(g, tx, speed, dt){
  g.moving = Math.abs(tx - g.x) > 0.5;
  const d = tx - g.x, step = speed*dt;
  if(Math.abs(d) <= step){ g.x = tx; return true; }
  g.dir = Math.sign(d);
  g.x += Math.sign(d)*step; g.walk = (g.walk||0) + dt; return false;
}
function updateGuests(dt){
  const qList = guests.filter(g=>g.state==='queue'||g.state==='walkIn').sort((a,b)=>a.id-b.id);
  qList.forEach((g,i)=> g.qi = i);
  for(const g of guests){
    switch(g.state){
      case 'walkIn': { if(moveTo(g, deskX() + 30 + g.qi*17, 70, dt)) g.state='queue'; break; }
      case 'queue': {
        moveTo(g, deskX() + 30 + g.qi*17, 60, dt);
        g.wait += dt;
        if(g.qi===0){ const r = freeGuestRoom(g); if(r){ r.reserved = g.id; g.room = r.id; g.state='toLift'; } }
        if(g.state==='queue' && g.wait > GUEST_TYPES[g.type].patience){ g.state='leave'; g.angry=true; S.sat = S.sat*0.95; floats.push({x:g.x,y:g.y-40,t:0,text: g.type==='vip'?'😤 not fancy enough':'😠'}); }
        break;
      }
      case 'toLift': { if(moveTo(g, liftX(), 80, dt)){ const r = S.rooms.find(x=>x.id===g.room); g.state='ride'; g.timer = 0.9; g.rideT = g.timer; doorsOpen = 1.2; } break; }
      case 'ride': {
        g.timer -= dt;
        if(g.timer<=0){
          const r = S.rooms.find(x=>x.id===g.room);
          if(!r){ g.state='leaveLift'; g.timer=0.6; break; }
          r.reserved = null; r.guest = g.id; g.state='inRoom'; g.timer = ROOMS[r.type].stay; g.alpha=1;
        }
        break;
      }
      case 'inRoom': {
        g.timer -= dt;
        const r = S.rooms.find(x=>x.id===g.room);
        if(!r){ g.state='leaveLift'; g.timer=0.6; break; }
        if(g.timer<=0){
          const def = ROOMS[r.type], gt = GUEST_TYPES[g.type];
          const pay = Math.max(1, Math.round(def.pay * (0.6+0.9*decorPct(r)) * starMult() * gt.pay * (g.inspector?3:1)));
          const rr2 = roomRect(r);
          addCoins(pay, rr2.x+rr2.w/2, rr2.y+20);
          addXP(Math.round(def.xp * gt.xp));
          S.served++; bumpWeek(); if(g.type==='vip') S.vipServed = true;
          r.guest = null; r.dirty = true;
          let happy = 0.6 + 0.4*decorPct(r);
          if(g.want){
            const a = amenityFor(g.want);
            if(a){ a.users=(a.users||0)+1; g.state='inAmen'; g.amen=a.id; g.timer=ROOMS[a.type].use; g.slot=a.users-1; happy=Math.min(1,happy+0.3); }
            else happy *= 0.75;
          }
          S.sat = S.sat*0.9 + happy*0.1;
          if(g.inspector) toast(`🎩 A hotel inspector loved their stay! Bonus 🪙${pay}`);
          if(g.state!=='inAmen'){ g.state='leaveLift'; g.timer=0.6; }
        }
        break;
      }
      case 'inAmen': {
        g.timer -= dt;
        const a = S.rooms.find(x=>x.id===g.amen);
        if(!a){ g.state='leaveLift'; g.timer=0.6; break; }
        if(g.timer<=0){
          const def = ROOMS[a.type], q = roomRect(a);
          const pay = Math.max(1, Math.round(def.pay * starMult() * (0.8+0.4*decorPct(a)) * GUEST_TYPES[g.type].pay));
          addCoins(pay, q.x+q.w/2, q.y+20); addXP(def.xp);
          a.users = Math.max(0,(a.users||1)-1); a.uses = (a.uses||0)+1;
          if(a.uses % 3 === 0) a.dirty = true;
          g.state='leaveLift'; g.timer=0.6;
        }
        break;
      }
      case 'leaveLift': {
        g.x = liftX(); g.y = laneY(); doorsOpen = Math.max(doorsOpen, 0.4);
        g.timer -= dt; g.alpha = 1 - Math.max(0,g.timer/0.6);
        if(g.timer<=0){ g.state='leave'; g.alpha=1; }
        break;
      }
      case 'leave': { if(moveTo(g, streetX()+40, 80, dt)) g.gone = true; break; }
    }
  }
  guests = guests.filter(g=>!g.gone);
}

/* ---------------- cleaning ---------------- */
function updateCleaning(dt){
  const {covered} = coverage();
  for(const r of S.rooms){
    if(!r.dirty || r.guest || (r.users||0)>0){ r.cleanT = 0; continue; }
    if(covered.has(r.id)){ r.cleanT = (r.cleanT||0) + dt; if(r.cleanT >= 2.5){ r.dirty=false; r.cleanT=0; } }
  }
}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.1, (now-last)/1000); last = now; time += dt;
  const sdt = dt * gameSpeed();   // hotel time runs at the chosen speed
  if(isOpen()){
    spawnTimer -= sdt;
    if(spawnTimer<=0){ spawnGuest(); spawnTimer = spawnInterval() * (0.7+Math.random()*0.6); }
  }
  updateGuests(sdt); updateCleaning(sdt);
  for(const r of S.rooms){ if(r.anim){ r.anim.t+=dt; if(r.anim.t>0.2) r.anim=null; } if(r.pulse>0) r.pulse-=dt; }
  doorsOpen = Math.max(0, doorsOpen - sdt);
  floats.forEach(f=>f.t+=dt); floats = floats.filter(f=>f.t<1.4);
  for(const p of confetti){ p.t+=dt; p.vy += 700*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.r += p.vr*dt; }
  confetti = confetti.filter(p=>p.t<3);
  autosave += dt;
  if(autosave>5){ autosave=0; updateRate(); checkGoals(); save(); cloudTick=(cloudTick+1)%3; if(cloudTick===0){ cloudSave(); onlineSave(); pushScores(); } }
  draw(dt); updateTop();
  requestAnimationFrame(frame);
}

/* ---------------- camera ---------------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let view = {s:1, ox:0, oy:0, dpr:1};
function resize(){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
}
function camTarget(){
  const dpr = window.devicePixelRatio||1, W = cv.width/dpr, H = cv.height/dpr;
  const fr = ui.focus ? S.rooms.find(r=>r.id===ui.focus) : null;
  if(fr){
    // fit the room into the part of the screen the panel doesn't cover
    let ax=0, ay=0, aw=W, ah=H;
    const pr = panel.style.display!=='none' ? panel.getBoundingClientRect() : null, cr = cv.getBoundingClientRect();
    if(pr && pr.width>0){
      if(pr.width > W*0.8) ah = Math.max(160, pr.top - cr.top);
      else aw = Math.max(200, pr.left - cr.left);
    }
    const q = roomRect(fr);
    const s = Math.min(aw*0.86/q.w, ah*0.78/q.h, 3.2);
    return {s, ox: ax + aw/2 - (q.x+q.w/2)*s, oy: ay + ah/2 - (q.y+q.h/2)*s};
  }
  const b = (ui.drag && ui.drag.moved && ui.drag.bounds) || (ui.newDrag && ui.newDrag.moved && ui.newDrag.bounds) || buildBounds();
  const bw = b.x1 - b.x0, bh = b.y1 - b.y0;
  let aw = W, ah = H;
  const hidden = document.body.classList.contains('dragOut');   // menu tucked away while dragging: use the whole screen
  const pr = panel.style.display==='block' && !hidden ? panel.getBoundingClientRect() : null, cr = cv.getBoundingClientRect();
  if(pr && pr.width>0){ if(pr.width > W*0.8) ah = Math.max(160, pr.top - cr.top); else aw = Math.max(220, pr.left - cr.left); }
  const reserve = (pr && pr.width>0 && pr.width > W*0.8) ? 0 : 92; // room for the icon buttons
  const s = Math.min(aw/bw, (ah-reserve)/bh, 1.6);
  return {s, ox:(aw - bw*s)/2 - b.x0*s, oy:(ah - reserve - b.y1*s)};
}
function updateCam(dt){
  const t = camTarget();
  if(!cam.ready){ Object.assign(cam, t, {ready:true}); }
  const k = 1 - Math.exp(-(dt||0.016)*10);
  cam.s += (t.s-cam.s)*k; cam.ox += (t.ox-cam.ox)*k; cam.oy += (t.oy-cam.oy)*k;
  view = {s:cam.s, ox:cam.ox, oy:cam.oy, dpr:window.devicePixelRatio||1};
}

/* ---------------- drawing ---------------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function skyColors(){
  const h = new Date().getHours() + new Date().getMinutes()/60;
  if(h>=6.5 && h<17.5) return ['#7ec8ff','#d6f0ff', false];
  if(h>=17.5 && h<19.5) return ['#ff9a8b','#ffd8a8', false];
  if(h>=5 && h<6.5) return ['#a7b8ff','#ffd6c4', false];
  return ['#1b1f4a','#3b3f7a', true];
}
function draw(dt){

  ctx.fillStyle = night ? '#2a2d5e' : 'rgba(120,150,200,.35)';
  for(let i=0;i<14;i++){ const bw=60+((i*37)%50), bh=80+((i*53)%160); ctx.fillRect(i*W/12 - 20, H-bh-SIDEWALK*s, bw, bh); }

  ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);
  const p = plot(), gy = groundY(), bb = buildBounds(0);
  // hotel sign above the tallest part of the building
  const sx = (bb.x0 + bb.x1)/2, sy = TOP + (WORLD_F - bb.f1)*FLOOR - 30;
  ctx.fillStyle = '#2b2340'; rr(sx - 90, sy - 13, 180, 26, 13); ctx.fill();
  ctx.fillStyle = '#ffc94d'; ctx.font = 'bold 14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('★ ' + (S.name||'My Hotel') + ' ★', sx, sy);
  const cov = coverage();
  const dragId = ui.drag && ui.drag.moved ? ui.drag.room.id : null;
  for(const r of S.rooms) if(r.id!==dragId) drawRoom(r, cov.covered.has(r.id));
  // sidewalk
  ctx.fillStyle = '#5f6672'; ctx.fillRect(-2000, gy+SIDEWALK, worldW()+4000, 2000);
  ctx.fillStyle = '#9aa1ad'; ctx.fillRect(-2000, gy, worldW()+4000, SIDEWALK);
  ctx.fillStyle = '#b8bec8'; ctx.fillRect(-2000, gy, worldW()+4000, 8);
  ctx.fillStyle = '#7c8390'; for(let x=-2000; x<worldW()+2000; x+=60) ctx.fillRect(x, gy+8, 2, SIDEWALK-8);
  const open = isOpen(), lob = lobbyRoom();
  if(lob){ const lq = visRect(lob), sx = lq.x + lq.w - 114;
    ctx.fillStyle = open ? '#3fae8c' : '#ff7a90'; rr(sx, lq.y+10, 46, 18, 6); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 10px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(open?'OPEN':'CLOSED', sx+23, lq.y+19); ctx.textBaseline='alphabetic'; }
  for(const g of guests) if(g.state!=='inRoom' && g.state!=='inAmen'){ if(g.state==='ride') g.alpha = Math.max(0, g.timer/g.rideT - 0.2); drawBean(g.x, g.y, g, 1); }
  for(const g of guests) if(g.state==='inAmen') drawAmenGuest(g);
  if(ui.newDrag && ui.newDrag.moved && ui.newDrag.over) drawNewRoomDrag(cov);
  if(ui.newItem && ui.newItem.moved && ui.newItem.over) drawNewItemDrag();
  if(dragId){
    drawDropSpot();
    const r = ui.drag.room;
    ctx.save(); ctx.shadowColor='rgba(43,35,64,.45)'; ctx.shadowBlur=24; ctx.shadowOffsetY=10;

/* ---------------- room drag ---------------- */
function dropTarget(){
  const d = ui.drag, r = d.room, def = ROOMS[r.type], q = visRect(r), h = hOf(r.type);
  const c = Math.round((q.x - BX)/CELL);
  let f = plot().h - h - Math.round((q.y - TOP)/FLOOR);
  if(def.ground) f = 0;
  if(f===r.f && c===r.c) return {f,c,kind:'same'};
  if(canPlace(r.type, f, c, r.id)) return {f,c,kind:'move'};
  const hits = S.rooms.filter(o=>{ if(o.id===r.id) return false; const od = ROOMS[o.type], oh = hOf(o.type);
    return c < o.c+od.w && o.c < c+def.w && f < o.f+oh && o.f < f+h; });
  if(hits.length===1){
    const o = hits[0], od = ROOMS[o.type];
    if(o.f===f && o.c===c && od.w===def.w && hOf(o.type)===h){
      const okA = !(def.ground && f!==0) && !(def.minFloor && f<def.minFloor);
      const okB = !(od.ground && r.f!==0) && !(od.minFloor && r.f<od.minFloor);
      if(okA && okB) return {f,c,kind:'swap',other:o};
    }
  }
  return {f,c,kind:'bad', problem: placeProblem(r.type, f, c, r.id)};
}
function drawDropSpot(){
  const t = dropTarget(); if(t.kind==='bad' || t.kind==='same') return;
  const r = ui.drag.room, def = ROOMS[r.type], h = hOf(r.type);
  const x = BX + t.c*CELL, y = TOP + (plot().h - t.f - h)*FLOOR;
  ctx.fillStyle = 'rgba(43,35,64,.18)'; ctx.fillRect(x, y, def.w*CELL, h*FLOOR);
}
function animateFrom(r, fromX, fromY){ const q = roomRect(r); r.anim = {dx: fromX - q.x, dy: fromY - q.y, t:0}; }
function firstFreeSpot(type){
  const def = ROOMS[type], p = plot(), h = hOf(type), bb = buildBounds(0);
  // 1) on top of the building, lowest open floor first, left to right across the hotel
  for(let f=1; f+h<=p.h; f++) for(let c=bb.c0; c+def.w<=bb.c1; c++) if(canPlace(type,f,c)) return {f,c};
  // 2) on the ground beside the hotel, to the right first, then to the left
  for(let d=0; d<p.w; d++){
    const right = bb.c1 + d, left = bb.c0 - def.w - d;
    if(right+def.w<=p.w && canPlace(type,0,right)) return {f:0,c:right};
    if(left>=0 && canPlace(type,0,left)) return {f:0,c:left};
  }
  // 3) anywhere it can stand
  for(let f=0; f+h<=p.h; f++) for(let c=0; c+def.w<=p.w; c++) if(canPlace(type,f,c)) return {f,c};

}
function placeNewRoom(type, extra){
  const spot = firstFreeSpot(type);

  const r = Object.assign(mkRoom(S.nextId++, type, spot.f, spot.c, Math.floor(Math.random()*WALL_COLORS.length)), extra||{});
  r.pulse = 2.5; S.rooms.push(r); return r;
}

function itemAt(r, p){

  const list = (r.items||[]).slice().reverse();
  // front items first, then back items
  const order = list.filter(it=>{ const d=ITEMS[it.id]; return d && !(d.back||d.zone==='wall'||d.zone==='ceiling'); }).concat(list.filter(it=>{ const d=ITEMS[it.id]; return d && (d.back||d.zone==='wall'||d.zone==='ceiling'); }));

async function onlineSignedIn(){

      if(localFresh) useHotel(remote, d.savedAt);
      else { online.asking = true; online.pending = {remote, savedAt: d.savedAt};
        modal(`<h2 style="margin:0 0 8px">Which hotel do you want to keep?</h2>
          <div class="sub">Your Google account already has a hotel saved online, and this device has a different one.</div>

function useHotel(remote, savedAt){ S = remote; S.savedAt = savedAt || Date.now(); guests = []; lastTop = ''; checkPokeDay(); renderGoalsBox(); closePanel(); save(); toast('☁️ Loaded your online hotel'); }

async function onlineSave(force){
  if(!onlineAvailable() || !FB.user || !online.synced || online.busy || !S.name) return;
  const json = serialize(); if(!force && json === online.last) return;
  online.busy = true;
  try{ await FB.putSave({json, savedAt: S.savedAt || Date.now(), name: S.name.slice(0,30), level: level()}); online.last = json; }catch(e){}
  online.busy = false;
}
async function pushScores(force){
  if(!onlineAvailable() || !FB.user || !online.synced || !S.name) return;
  if(!force && Date.now() - online.lastScore < 60000) return;
  online.lastScore = Date.now();

    await FB.putScore(scoreEntry());
    if(S.wk && S.wk.id === weekId()) await FB.putWeek(S.wk.id, {name: S.name.slice(0,30), served: S.wk.n|0, updated: Date.now()});
  }catch(e){}
}
