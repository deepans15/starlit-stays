<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Starlit Stays</title>
<style>
  :root{
    --ink:#2b2340; --paper:#fff8ef; --peach:#ffb38a; --rose:#ff7a90; --mint:#6fd3b5;
    --sky1:#7ec8ff; --gold:#ffc94d; --panel:#fffdf8; --line:#e8dccb; --muted:#7a6e86;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1d1830;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  .chip{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;white-space:nowrap}

  /* floating HUD: no boxes, outlined game text over the sky (icons can be replaced by ChatGPT's art/ui files) */
  #hud{position:absolute;left:12px;top:10px;display:flex;gap:22px;align-items:center;z-index:4;pointer-events:none}
  .hg{display:flex;align-items:center;gap:6px}
  .hic{display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 0 rgba(43,35,64,.35))}
  .hic img{width:40px;height:40px;object-fit:contain}
  .hnum{font-size:26px;font-weight:900;color:#ffc94d;-webkit-text-stroke:5px #2b2340;paint-order:stroke fill;letter-spacing:.5px;line-height:1}
  .hnum.small{font-size:20px;-webkit-text-stroke:4px #2b2340}
  .hbadge{position:relative;display:flex;align-items:center;justify-content:center}
  #lvl{position:absolute;top:19px;font-size:16px;font-weight:900;color:#2b2340}
  #xpWrap{width:110px;height:14px;background:#5a4e72;border:3px solid #2b2340;border-radius:8px;overflow:hidden;margin-left:-4px}
  #xpBar{display:block;height:100%;width:0;background:linear-gradient(180deg,#ffe08a,#ffc94d)}
  #hudStars{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:4;pointer-events:none}
  #faceIcon{display:inline-flex;width:30px;height:30px;margin-left:4px} #faceIcon img,#faceIcon svg{width:30px;height:30px}
  #starIcons{display:flex;gap:1px;font-size:28px;color:#ffc94d;-webkit-text-stroke:2.5px #2b2340;paint-order:stroke fill;line-height:1}
  #starIcons .off{color:#fff8ef;opacity:.85}
  #starIcons img{width:28px;height:28px}
  #speedBtn{position:absolute;right:12px;top:8px;z-index:4;display:flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer;font-size:24px;padding:4px}
  #speedBtn .hic img{width:30px;height:30px}
  #shiftBtn{background:#ff7a90}
  #shiftBtn.open{background:#6fd3b5}
  .dtimer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#2b2340;color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:1px 6px;white-space:nowrap;display:none}
  #shiftBtn.open .dtimer{display:block}
  #stage{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #dock{position:absolute;right:14px;bottom:26px;display:flex;gap:12px;align-items:flex-end;z-index:5}
  body.panelOpen #dock{right:388px}
  body.panelOpen #blockCount{display:none}
  .dbtn{position:relative;border:3px solid var(--ink);border-radius:18px;background:#ffc94d;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .08s}
  .dbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
  .dbtn.big{width:76px;height:76px;border-radius:22px}
  .dbtn.mid{width:60px;height:60px;background:#ffd9b8}
  .dbtn.small{width:48px;height:48px;border-radius:14px;background:#fff}
  .dbtn.on{background:var(--mint)}
  .dbtn .ic{display:flex;align-items:center;justify-content:center}
  .dbtn .ic img{width:70%;height:70%;object-fit:contain}
  .dlab{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 2px 0 var(--ink),0 0 4px rgba(0,0,0,.5)}
  .tabs{display:flex;gap:6px;margin:8px 0 12px}
  #panel.wide{width:min(430px,calc(100% - 20px))}
  body.panelOpen.panelWide #dock{right:458px}
  body.dragOut #panel, body.dragOut #marks{opacity:0;pointer-events:none;transform:translateX(40px)}
  #panel, #marks{transition:opacity .15s, transform .15s}
  #loading{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(#2b2a5c,#45397a);color:#ffe8a8;font-weight:900;transition:opacity .45s}
  #loading.done{opacity:0;pointer-events:none}
  #loading .t{font-size:30px;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  #loading .b{width:min(260px,70vw);height:12px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
  #loading .b i{display:block;height:100%;width:0;background:#ffc94d;border-radius:99px;transition:width .2s}
  #loading .s{font-size:13px;color:#cfc6ef;font-weight:700}
  #openPrompt{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:6;pointer-events:none}
  #openPrompt.show{display:flex}
  #openPrompt .op{pointer-events:auto;background:rgba(255,253,248,.97);border:3px solid var(--ink);border-radius:22px;padding:18px 22px;text-align:center;box-shadow:0 10px 0 rgba(43,35,64,.3);max-width:min(330px,86vw);animation:popIn .35s ease-out}
  #openPrompt .opt{font-size:20px;font-weight:900}
  #openPrompt .ops{color:var(--muted);font-size:13px;margin:4px 0 12px}
  #openPrompt .btn.big{font-size:20px;padding:12px 26px;border-radius:16px;animation:pulseBtn 1.4s ease-in-out infinite}
  #openPrompt .opa{display:flex;gap:6px;justify-content:center;align-items:center;font-size:12px;font-weight:700;margin-top:10px;color:var(--muted)}
  #openPrompt .oplink{background:none;border:none;color:#6a5acd;font-weight:800;font-size:12px;margin-top:4px;cursor:pointer;text-decoration:underline}
  @keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes pulseBtn{50%{transform:scale(1.06)}}
  #visitBar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:none;align-items:center;gap:12px;z-index:9;background:rgba(255,253,248,.97);border:3px solid var(--ink);border-radius:18px;padding:8px 12px;box-shadow:0 6px 0 rgba(43,35,64,.25);max-width:calc(100% - 20px)}
  body.visiting #visitBar{display:flex}
  #visitBar .vb{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  #visitBar .vb b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #visitBar .vb span{font-size:12px;color:var(--muted);font-weight:700}
  body.visiting #dock, body.visiting #hud, body.visiting #hudStars, body.visiting #goalsBox, body.visiting #speedBtn, body.visiting #helper, body.visiting #helperArrow, body.visiting #openPrompt, body.visiting #blockCount{display:none!important}
  #tipsBtn{position:absolute;right:78px;top:12px;display:none;z-index:6;border:2px solid var(--ink);background:#fff6d6;color:var(--ink);font-weight:900;font-size:13px;border-radius:999px;padding:4px 10px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
  #tipsBtn .hic img{width:18px;height:18px}
  #tipsBtn:active{transform:translateY(2px);box-shadow:none}
  body.visiting #tipsBtn{display:none!important}
  body.panelOpen #tipsBtn{display:none!important}
  @media (max-width:640px){ #tipsBtn{right:10px;top:74px;font-size:12px} }
  @media (min-width:1000px) and (max-width:1300px){ #hudStars{left:548px;transform:none} }
  @media (min-width:641px) and (max-width:999px){ #hudStars{left:14px;top:52px;transform:none} #goalsBox{top:92px} }
  #crateBtn{position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:4;width:62px;min-height:70px;border:3px solid var(--ink);border-radius:14px;background:#ffe9a8;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 var(--ink);padding:2px}
  #crateBtn .ic{font-size:26px;line-height:1} #crateBtn .ic img{width:38px;height:38px}
  body.visiting #crateBtn, body.panelOpen #crateBtn{display:none}
  #zoomCtl{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:4}
  #zoomCtl button{width:40px;height:40px;border-radius:12px;border:3px solid #2b2340;background:#fff;color:#2b2340;font-size:22px;font-weight:900;line-height:1;cursor:pointer;box-shadow:0 3px 0 #2b2340}
  #zoomCtl button:active{transform:translateY(2px);box-shadow:0 1px 0 #2b2340}
  body.panelOpen #zoomCtl{display:none}
  #floorNav{position:absolute;left:14px;top:calc(50% + 54px);display:none;flex-direction:column;align-items:center;gap:6px;z-index:4}
  #floorNav button{width:44px;height:40px;border-radius:12px;border:3px solid #2b2340;background:#fff;color:#2b2340;font-size:18px;font-weight:900;line-height:1;cursor:pointer;box-shadow:0 3px 0 #2b2340}
  #floorNav button:active{transform:translateY(2px);box-shadow:0 1px 0 #2b2340}
  #floorNav .fl{min-width:44px;text-align:center;background:#2b2340;color:#fff;border-radius:10px;padding:3px 4px;font-weight:900;font-size:12px;line-height:1.1}
  #floorNav .fl small{display:block;font-size:9px;font-weight:700;opacity:.8}
  body.visiting #floorNav{display:none!important}
  #dropZones{position:absolute;left:50%;top:78px;transform:translateX(-50%);display:none;gap:14px;z-index:40;pointer-events:none}
  body.dragZones #toasts{opacity:0}
  #dropZones.show{display:flex}
  body.panelOpen #dropZones{left:calc(50% - 220px)}
  @media (max-width:640px){ body.panelOpen #dropZones{left:50%} }
  #dropZones .zone{min-width:118px;padding:12px 16px;border-radius:18px;border:3px dashed #fff;background:rgba(43,35,64,.82);color:#fff;font-weight:900;font-size:14px;text-align:center;line-height:1.2;transition:transform .12s, background .12s}
  #dropZones .zone .e{display:block;font-size:24px}
  #dropZones .zone.sell{background:rgba(214,51,79,.82)}
  #dropZones .zone.cancel{display:none;background:rgba(122,110,134,.9)} #dropZones.buying .zone{display:none} #dropZones.buying .zone.cancel{display:block}
  #dropZones .zone.cancel.hot{background:#d6334f}
  #dropZones .zone.hot{transform:scale(1.12);background:#3fae8c;border-style:solid}
  #dropZones .zone.sell.hot{background:#ff5d78}
  #marks{position:absolute;display:none;flex-direction:column;gap:3px;z-index:8}
  #marks button{border:3px solid var(--line);border-right:none;background:#f3ece2;border-radius:14px 0 0 14px;width:64px;padding:4px 2px;font-weight:800;font-size:10.5px;cursor:pointer;color:#7a6e86;line-height:1.15;text-align:center;box-shadow:-4px 4px 10px rgba(0,0,0,.18);transition:transform .12s,background .12s,width .12s}
  #marks button .e{display:block;font-size:16px;line-height:1.1}
  #marks button.on{background:var(--panel);color:var(--ink);width:72px;transform:translateX(-8px);border-color:var(--line)}
  #marks button.ltd:not(.on){background:#ffe6b8;color:#b5651d}
  #marks.slim button{width:58px;font-size:9.5px;padding:7px 1px}
  #marks.slim button.on{width:62px;transform:translateX(-4px)}
  #marks.top{flex-direction:row}
  #marks.top button{border:3px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;width:auto;flex:1;box-shadow:0 -3px 8px rgba(0,0,0,.15)}
  #marks.top button.on{width:auto;transform:translateY(-6px)}
  .bsec{scroll-margin-top:6px;display:none} .bsec.show{display:block}
  .bsec h3.big{margin:6px 0 8px;font-size:15px;border-bottom:2px dashed var(--line);padding-bottom:4px}
  .tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 4px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}  #hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;display:none;gap:10px;align-items:center;z-index:5;white-space:nowrap}
  #hint button{border:none;background:var(--rose);color:#fff;border-radius:999px;padding:4px 10px;font-weight:800;cursor:pointer}
  #goalsBox{cursor:pointer;position:absolute;left:10px;top:64px;background:rgba(255,253,248,.94);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:12px;max-width:240px;z-index:4}
  #goalsBox b{font-size:12px}
  #goalsBox .g{margin-top:4px;display:flex;justify-content:space-between;gap:8px}
  #goalsBox .r{color:#b07a00;font-weight:800;white-space:nowrap}
  #goalsBox .next{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--muted)}
  #panel{position:absolute;right:10px;top:10px;bottom:10px;width:min(360px,calc(100% - 20px));background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px;overflow:auto;display:none;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #panel h2{margin:0 0 4px;font-size:18px;padding-right:24px}
  #panel h3{margin:14px 0 6px;font-size:14px}
  #panel .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
  #panel .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
  .item{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;background:#fff}
  .item .sw{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
  .item .sw img{max-width:34px;max-height:34px}
  .item .info{flex:1;font-size:13px}
  .item .info b{font-size:14px}
  .item .meta{color:var(--muted);font-size:12px}
  .item .btns{display:flex;flex-direction:column;gap:4px}
  .btn{border:none;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;background:var(--mint);color:#173b31;white-space:nowrap}
  .btn[disabled]{background:#e6ddd0;color:#9c917f;cursor:not-allowed}
  .btn.warn{background:var(--rose);color:#fff}
  .btn.alt{background:#e9e1ff;color:#3b2f7a}
  .cat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bcard{position:relative;touch-action:pan-y;background:#fff;border:2px solid var(--line);border-radius:14px;padding:26px 6px 6px;cursor:pointer;text-align:center;display:flex;flex-direction:column}
  .bcard:hover{border-color:#f19a6c}
  .cat.mini{grid-template-columns:repeat(3,1fr);gap:6px}
  .cat.mini .bcard{padding:20px 3px 4px;border-radius:12px}
  .cat.mini .thumb{height:58px;margin-bottom:2px}
  .cat.mini .rate{font-size:10px;padding:0 4px;right:3px;top:3px}
  .cat.mini .pr{font-size:12px;margin-top:2px;padding:1px 0}
  .bcard.locked{cursor:not-allowed;opacity:.75}
  .bcard.poor{opacity:.6}
  .thumb{touch-action:none;cursor:grab;height:104px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
  .thumb .shape{border:3px solid var(--ink);border-top-width:6px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .bcard .nm{font-weight:800;font-size:12px;line-height:1.2;margin-top:auto}
  .bcard .rate{position:absolute;right:6px;top:5px;background:#e8f7f0;border:2px solid #3fae8c;color:#1f6e55;border-radius:9px;font-weight:900;font-size:11px;padding:1px 6px;white-space:nowrap}
  .roomRate{position:absolute;right:34px;top:0;background:#e8f7f0;border:2px solid #3fae8c;color:#1f6e55;border-radius:10px;font-size:13px;font-weight:900;padding:2px 8px}
  .bcard .pr{font-weight:900;color:#b07a00;font-size:15px;margin-top:4px;background:#fff6d6;border-radius:9px;padding:2px 0}
  .bcard .ea{color:var(--muted);font-size:11px}
  .lock{position:absolute;left:6px;top:5px;z-index:1;background:#ffc94d;border:2px solid var(--ink);border-radius:8px;font-weight:900;font-size:12px;padding:1px 6px}
  .colors{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .colors span{width:28px;height:28px;border-radius:8px;cursor:pointer;border:3px solid transparent}
  .colors span.on{border-color:var(--ink)}
  .wall-patterns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:7px;margin:8px 0 12px}
  .wall-patterns button{border:2px solid #ddcfc5;border-radius:10px;padding:5px;background:#fff8ef;color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
  .wall-patterns button[aria-pressed="true"]{border-color:#3fae8c;box-shadow:0 0 0 1px #3fae8c}
  .wall-patterns .sample{display:block;height:40px;border-radius:6px;margin-bottom:4px;background-size:32px 32px}
  .meter{height:10px;background:#eee3d3;border-radius:6px;overflow:hidden;margin:6px 0 12px}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,#ff8a7a,#ffc94d,#6fd3b5)}
  #blockCount{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;text-shadow:0 2px 0 #2b2340,0 0 6px rgba(0,0,0,.4);pointer-events:none;z-index:3}
  #helper{position:absolute;left:14px;bottom:14px;display:none;align-items:flex-end;gap:8px;z-index:6;pointer-events:none;max-width:min(340px,90%)}
  #helperPic{width:72px;height:104px;flex:none;display:flex;align-items:flex-end;justify-content:center;font-size:54px}
  #helperPic img{width:72px;height:104px;object-fit:contain}
  #helperBubble{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;box-shadow:0 6px 0 rgba(43,35,64,.25);pointer-events:auto;position:relative}
  #helperBubble .hb{display:flex;gap:6px;margin-top:8px}
  #helperBubble #helperGo{background:#ffc94d}
  #helperBubble button{display:block;border:none;background:var(--mint);border-radius:10px;padding:5px 10px;font-weight:800;cursor:pointer}
  #helperArrow{position:fixed;z-index:8;font-size:34px;pointer-events:none;display:none;animation:bob 0.8s ease-in-out infinite alternate;filter:drop-shadow(0 3px 0 rgba(43,35,64,.4))}
  @keyframes bob{from{transform:translate(-50%,0)}to{transform:translate(-50%,-10px)}}
  #toasts{position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:7;pointer-events:none}
  .toast{background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;animation:fade 3.2s forwards;text-align:center}
  @keyframes fade{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  #modal{position:fixed;inset:0;background:rgba(20,15,35,.6);display:none;align-items:center;justify-content:center;z-index:10}
  #modal .card{background:var(--panel);border-radius:20px;padding:22px;width:min(400px,92%);text-align:center;max-height:90%;overflow:auto}
  #modal input{width:100%;font-size:18px;padding:10px;border-radius:12px;border:2px solid var(--line);margin:12px 0;text-align:center}
  .lvlBig{font-size:46px;font-weight:900;color:#e8a400;margin:4px 0;text-shadow:0 3px 0 #2b2340}
  .unlock{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;margin:6px 0;font-size:14px}
  .unlock .ic{font-size:22px;width:30px;text-align:center}
  @media (max-width:640px){
    #blockCount{display:none} body.panelOpen #dock{display:none}
    #helper{top:84px;bottom:auto} #toasts{top:auto;bottom:112px} .toast{font-size:12px;padding:6px 12px} #helperPic{width:48px;height:70px} #helperPic img{width:48px;height:70px} #helper{max-width:calc(100% - 16px)}
    #dock{gap:8px;right:8px} .dbtn.big{width:64px;height:64px} .dbtn.mid{width:52px;height:52px} .dbtn.small{width:42px;height:42px} 
    #goalsBox{display:none} #hud{gap:10px;left:8px} .hnum{font-size:19px;-webkit-text-stroke:4px #2b2340} .hnum.small{font-size:16px} .hic svg{width:28px;height:28px} #xpWrap{width:60px} #lvl{top:13px;font-size:12px} #hudStars{top:46px} #starIcons{font-size:20px} #speedBtn{top:4px}
    /* phones: the menu slides in from the right side, leaving room on the left for the bookmarks and a strip of the hotel */

const SPEEDS = [1, 2, 3];

function loadProfileCached(){ if(!_profCache) _profCache = loadProfile(); return _profCache; }
function loadProfile(){
  let p = {};
  try{ p = JSON.parse(localStorage.getItem(PROFILE_KEY)) || {}; }catch(e){}
  if(!p.name){
    // players from builds before the profile existed: borrow the name from their newest old save
    try{
      for(const k of Object.keys(localStorage)){
        if(!k.startsWith('starlit-stays-build-') || k===SAVE_KEY) continue;
        const old = JSON.parse(localStorage.getItem(k));
        if(old && old.name){ p.name = old.name; p.seenHelp = true; }

  }
  return p;
}

const WALL_PATTERNS = window.STARLIT_WALL_PATTERNS || [{id:'stripes',name:'Ribbon Stripes',key:null}];
const WALL_COLORS = ['#ffd6e0','#d4f0ff','#e2f7d4','#fff1b8','#e6dcff','#ffe1c7','#c9f1ea','#f5d0ff',
  '#7a1f2b','#1f3a5f','#2f4a35','#4a2f5c','#5c3a28','#2b2d3a','#1f4d4a','#6b4a1f'];   // deep red, navy, forest, plum, walnut, charcoal, teal, bronze

/* ---------------- furniture ----------------
   Built-in items. ChatGPT can add or change items in art/items.js (see ART_BRIEF.md);
   each item's picture is art/decor/<id>.svg. Sizes are the art file's pixel size (drawn at half size).
   zone: floor (stands on the floor), wall (hangs, can move up/down), ceiling (hangs from the top), bed (one per guest room). */
const ITEM_DEFAULTS = [
  {id:'bed_basic',  name:'Basic Bed',     zone:'bed',     width:112, height:64,  cost:80,   decor:2,  level:1,  rooms:['guest'], emoji:'🛏️'},

  {id:'wallart',    name:'Wall Picture',  zone:'wall',    width:60,  height:44,  cost:120,  decor:4,  level:2,  emoji:'🖼️'},
  {id:'rug',        name:'Round Rug',     zone:'floor',   width:120, height:14,  cost:150,  decor:4,  level:3,  emoji:'🟣', back:true},
  {id:'armchair',   name:'Armchair',      zone:'floor',   width:64,  height:60,  cost:200,  decor:5,  level:3,  emoji:'🛋️'},
  {id:'clock',      name:'Wall Clock',    zone:'wall',    width:40,  height:40,  cost:110,  decor:3,  level:4,  emoji:'🕰️'},
  {id:'bookshelf',  name:'Bookshelf',     zone:'floor',   width:64,  height:104, cost:280,  decor:6,  level:5,  emoji:'📚'},
  {id:'tv',         name:'TV Stand',      zone:'floor',   width:76,  height:68,  cost:360,  decor:7,  level:6,  emoji:'📺'},
  {id:'chandelier', name:'Chandelier',    zone:'ceiling', width:84,  height:60,  cost:650,  decor:10, level:8,  emoji:'✨'},
  {id:'aquarium',   name:'Aquarium',      zone:'floor',   width:84,  height:68,  cost:850,  decor:12, level:10, emoji:'🐠'},
  {id:'statue',     name:'Golden Statue', zone:'floor',   width:52,  height:100, cost:1600, decor:18, level:12, emoji:'🗿'},
];
const ITEMS = {};
(function buildItems(){
  const norm = (d) => {
    if(!d || typeof d.id !== 'string' || !/^[a-z0-9_]{1,40}$/.test(d.id)) return null;
    const num = (v, def, lo, hi) => { v = Number(v); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def; };
    const zone = ['floor','wall','ceiling','bed'].includes(d.zone) ? d.zone : 'floor';
    const rooms = Array.isArray(d.rooms) && d.rooms.length ? d.rooms.filter(k=>['guest','amenity','lobby'].includes(k)) : (zone==='bed' ? ['guest'] : ['guest','amenity','lobby']);
    return { id:d.id, name:String(d.name||d.id).slice(0,30), zone,
      w: num(d.width,64,8,320)/2, h: num(d.height,64,8,320)/2,
      cost: Math.round(num(d.cost,100,0,100000)), decor: Math.round(num(d.decor,3,0,60)), lvl: Math.round(num(d.level,1,1,60)),
      rooms, emoji: typeof d.emoji==='string' && d.emoji && !d.emoji.includes('?') ? d.emoji.slice(0,4) : '✨', back: !!d.back || d.id.includes('rug'),
      category: typeof d.category==='string' ? d.category : undefined,
      climate: ['cool','warm','both'].includes(d.climate) ? d.climate : /air_?con|ceiling_fan/.test(d.id) ? 'cool' : /radiator|fireplace|heater/.test(d.id) ? 'warm' : /thermostat/.test(d.id) ? 'both' : undefined };
  };
  for(const d of ITEM_DEFAULTS){ const n = norm(d); if(n) ITEMS[n.id] = n; }
  const extra = Array.isArray(window.STARLIT_ITEMS) ? window.STARLIT_ITEMS : [];
  for(const d of extra){ const n = norm(Object.assign({}, ITEMS[d && d.id] ? ITEM_DEFAULTS.find(x=>x.id===d.id) : {}, d)); if(n) ITEMS[n.id] = n; }
})();
/* ---------------- themes ----------------
   ChatGPT adds themes without code changes:
   - a room style:   art/rooms/<theme>_<roomtype>.svg  (e.g. rooms/love_lounge.svg)  -> a style the player can pick for that room
   - a collection:   3 or more furniture ids that start with the same "<theme>_"     -> grouped in the shop, with a set bonus */
const ROOM_STYLES = {};   // roomtype -> [theme, ...]
const COLLECTIONS = {};   // theme -> [item ids]
(function findThemes(){
  const m = window.STARLIT_ART || {};
  for(const key of Object.keys(m)){
    const mm = /^rooms\/([a-z0-9]+)_([a-z0-9]+)$/.exec(key);
    if(mm && ROOMS[mm[2]] && mm[2]!==mm[1]){ (ROOM_STYLES[mm[2]] = ROOM_STYLES[mm[2]] || []).push(mm[1]); }
  }
  const byPrefix = {};
  for(const id of Object.keys(ITEMS)){ const p = id.split('_')[0]; if(id.includes('_')) (byPrefix[p] = byPrefix[p] || []).push(id); }
  const roomThemes = new Set(Object.values(ROOM_STYLES).flat());
  for(const [p, ids] of Object.entries(byPrefix)) if(ids.length >= 3 || roomThemes.has(p)) COLLECTIONS[p] = ids;
})();
const themeName = t => t.charAt(0).toUpperCase() + t.slice(1);
const themeIcon = t => ({gold:'🌟', pink:'🎀', love:'💕', halloween:'🎃', winter:'❄️', christmas:'🎄', spring:'🌸', summer:'🏖️', beach:'🏖️', space:'🚀', garden:'🌿', retro:'📻'})[t] || '✨';
const STYLE_COST = 250;
function collectionBonus(r){
  const out = [];
  for(const [t, ids] of Object.entries(COLLECTIONS)){
    const n = (r.items||[]).filter(it=>ids.includes(it.id)).length;
    if(n >= 3) out.push({theme:t, n, bonus: 3*n});
  }
  return out;
}
const itemsFor = r => Object.values(ITEMS).filter(it => it.rooms.includes(ROOMS[r.type].kind)).sort((a,b)=>a.lvl-b.lvl || a.cost-b.cost);

/* ---------------- progression ---------------- */
// The build area is open land; what limits the hotel is how many blocks (cells) it may use.
const WORLD_C = 14, WORLD_F = 20;   // up to 20 floors

  {blocks:12,lvl:1,cost:0},{blocks:16,lvl:2,cost:400},{blocks:20,lvl:3,cost:900},{blocks:24,lvl:4,cost:1600},

   Art files live in art/ and are listed in art/manifest.js. Anything missing falls back to shapes drawn in code. */
// ?v=BUILD makes browsers fetch fresh art after each update instead of showing old cached copies.
/* Animation frames come packed in sprite sheets (art/sheets.js): one request per animation instead of one per frame.
   A "frame" is a tiny object pointing at a cell of the sheet; ctx.drawImage understands it (patched just below), so the rest of the game still calls art('chars/guest_1_run_3') as before. */
class SheetFrame{ constructor(img,sx,sy,w,h){ this.img=img; this.sx=sx; this.sy=sy; this.width=w; this.height=h; this.naturalWidth=w; this.naturalHeight=h; } }
(()=>{
  const dI = CanvasRenderingContext2D.prototype.drawImage;
  CanvasRenderingContext2D.prototype.drawImage = function(im, ...a){
    if(im instanceof SheetFrame){
      if(a.length === 2) return dI.call(this, im.img, im.sx, im.sy, im.width, im.height, a[0], a[1], im.width, im.height);
      if(a.length === 4) return dI.call(this, im.img, im.sx, im.sy, im.width, im.height, a[0], a[1], a[2], a[3]);
      return dI.call(this, im.img, im.sx + a[0], im.sy + a[1], a[2], a[3], a[4], a[5], a[6], a[7]);
    }
    return dI.call(this, im, ...a);
  };
})();
const ART = {};
// The loading screen waits only for what the first screen needs (statics + walking guests). Everything else loads right after, in the background.
// ?v=BUILD makes browsers fetch fresh art after each update instead of showing old cached copies.
const artReady = new Promise(done => {
  const all = Object.entries(window.STARLIT_ART || {});
  const SHEETS = window.STARLIT_SHEETS || {};
  const sheeted = new Set(); for(const k in SHEETS) for(const f of SHEETS[k].frameKeys) sheeted.add(f);
  const url = f => 'art/' + f + '?v=' + BUILD;
  const loadSheet = (k, cb) => {
    const sh = SHEETS[k], img = new Image();
    img.onload = () => { sh.frameKeys.forEach((fk,i) => { ART[fk] = new SheetFrame(img, (i % sh.cols)*sh.cellW, Math.floor(i / sh.cols)*sh.cellH, sh.cellW, sh.cellH); }); if(cb) cb(); };
    img.onerror = () => { if(cb) cb(); };
    img.src = url(sh.file);
  };
  const statics = all.filter(([k]) => !sheeted.has(k));
  const sheetKeys = Object.keys(SHEETS);
  const firstSheets = sheetKeys.filter(k => /_walk$/.test(k));
  const laterSheets = sheetKeys.filter(k => !/_walk$/.test(k));
  // statics that are only needed once a room or effect is in use
  const lateStatic = ([k]) => k.startsWith('weather/') || k.startsWith('effects/') || k.startsWith('decor/') || (k.startsWith('backgrounds/') && k.includes('_fx_')) || (k.startsWith('chars/') && /_[a-z_]+_\d+$/.test(k) && !/_walk_\d+$/.test(k));
  const first = statics.filter(e => !lateStatic(e)), later = statics.filter(lateStatic);
  let started = false;
  const startLater = () => { if(started) return; started = true;
    for(const [key, file] of later){ const img = new Image(); img.onload = () => { ART[key] = img; }; img.src = url(file) + (/^chars\/.+_(run|lift)_\d+$/.test(key) ? '&rev=gym8' : ''); }
    laterSheets.forEach(k => loadSheet(k)); };
  const total = first.length + firstSheets.length; let left = total; const bar = document.getElementById('loadBar');
  const tick = () => { left--; if(bar) bar.style.width = Math.round(100*(total-left)/Math.max(1,total))+'%'; if(left<=0){ done(); startLater(); } };
  if(!left){ done(); startLater(); }
  for(const [key, file] of first){
    const img = new Image();
    img.onload = () => { ART[key] = img; tick(); };
    img.onerror = tick;
    img.src = url(file) + (/^chars\/.+_(run|lift)_\d+$/.test(key) ? '&rev=gym8' : '');
  }
  firstSheets.forEach(k => loadSheet(k, tick));
  setTimeout(()=>{ done(); startLater(); }, 6000);   // slow connection: start anyway, late pictures pop in when they arrive
});
const art = k => ART[k] || null;
const GUEST_SKINS = (()=>{ let n=0; while((window.STARLIT_ART||{})['chars/guest_'+(n+1)]) n++; return Math.max(n,6); })();   // grows as ChatGPT adds guest_N art
function sprite(key, x, y, w, h, flip){
  const img = art(key); if(!img) return false;
  if(flip){ ctx.save(); ctx.translate(x+w, y); ctx.scale(-1,1); ctx.drawImage(img, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(img, x, y, w, h);
  return true;
}

function animFrame(base, anim, count, fps, t){
  const n = 1 + Math.floor((t===undefined ? time : t) * fps) % count;
  const k = `${base}_${anim}_${n}`;

}

function freshState(){

  return {v:3, build:SAVE_VERSION, name:'', coins:1500, xp:0, plot:0, nextId:2, served:0, goals:[], storage:[], inv:{},
    moved:false, movedItem:false, boughtItem:false, vipServed:false, seenLevel:1,
    rooms, shiftEnd:0, freeShift:true, sat:0.6, rate:0, pokes:20, pokeDay:'', savedAt:Date.now()};

function migrate(s){
  if(!s || s.build !== SAVE_VERSION) return null;
  s.rooms = (s.rooms||[]).filter(r=>ROOMS[r.type]);
  for(const r of s.rooms){ r.items = (r.items||[]).filter(it=>ITEMS[it.id]); for(const it of r.items) itemUid = Math.max(itemUid, (it.u||0)+1); }
  s.storage = s.storage || []; s.inv = s.inv || {};
  for(const r of s.rooms) if(ROOMS[r.type].kind==='service' || ROOMS[r.type].kind==='amenity'){ r.dirty = false; r.cleanT = 0; }   // only guest rooms get messy
  for(const r of s.rooms) if(r.type.startsWith('treehouse') && !(r.items||[]).some(it=>ITEMS[it.id] && ITEMS[it.id].zone==='bed')){ r.items = r.items || []; r.items.unshift(mkItem('bed_basic', 8)); }
  // a room whose size changed (Laundry Room 1x1 -> 2x1) and now overlaps another room goes to storage instead
  const taken = new Map();
  const resized = new Set(['laundry']);   // rooms whose size changed give way to everything else
  for(const r of [...s.rooms].sort((a,b)=>resized.has(a.type)-resized.has(b.type))){ const d = ROOMS[r.type], h = d.h; let clash = false;
    for(let i=0;i<d.w;i++) for(let j=0;j<h;j++){ const k = (r.f+j)+','+(r.c+i); if(taken.has(k) || r.c+i >= WORLD_C) clash = true; }
    if(clash && d.kind!=='lobby'){ r._clash = true; continue; }
    for(let i=0;i<d.w;i++) for(let j=0;j<h;j++) taken.set((r.f+j)+','+(r.c+i), r.id); }
  for(const r of s.rooms.filter(r=>r._clash)) s.storage.push({type:r.type, wall:r.wall, floor:r.floor, wallColor:r.wallColor, wallPattern:r.wallPattern||'stripes', items:r.items||[], style:r.style||null, ownedStyles:r.ownedStyles||[]});
  s.rooms = s.rooms.filter(r=>!r._clash);
  return s;
}
function load(){
  let raw=null;

  }

}

/* ---------------- cloud save (per player, private) ---------------- */
const cloud = {ref:null, busy:false, last:''};
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc('data/users/' + uid + '/' + CLOUD_DOC);
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}), 10000))]);
    if(snap && snap.exists){
      const d = snap.data();
      if(d && typeof d.json === 'string'){
        const remote = migrate(JSON.parse(d.json));
        if(remote && (d.savedAt||0) > (S.savedAt||0) + 2000){
          S = remote; S.savedAt = d.savedAt; guests = []; lastTop=''; checkPokeDay(); renderGoalsBox(); closeModal(); closePanel();
          try{ localStorage.setItem(SAVE_KEY, serialize()); }catch(e){}
          toast('☁️ Loaded your cloud save');
        }
      }
    }
    cloud.ref = ref;
    try{
      cloud.profile = db.doc('data/users/' + uid + '/profile');
      const ps = await cloud.profile.get();
      const pd = ps && ps.exists ? ps.data() : null;
      if(pd && pd.name && !loadProfile().name){ saveProfile({name: pd.name, seenHelp: true}); if(S.name !== pd.name){ S.name = pd.name; save(); closeModal(); lastTop=''; } }
      else if(S.name && (!pd || pd.name !== S.name)) await cloud.profile.set({name: S.name});
    }catch(e){}
    cloudSave();
  }catch(e){ /* cloud save unavailable: browser save still works */ }
}
async function cloudSave(){
  if(ui.visit || ui.loadingCode) return;
  if(!cloud.ref || cloud.busy || !S.name) return;
  const json = serialize().replace(/"savedAt":\d+,?/,'');
  if(json === cloud.last) return;
  cloud.busy = true;
  try{ await cloud.ref.set({json: serialize(), savedAt: S.savedAt || Date.now()}); cloud.last = json; }
  catch(e){ if(e && (e.code==='invalid_argument' || e.code==='revoked' || e.code==='not_granted' || e.code==='quota_exceeded')) cloud.ref = null; }
  cloud.busy = false;
}

/* ---------------- helpers ---------------- */
const plot = () => ({w:WORLD_C, h:WORLD_F});
const blocksMax = () => BLOCK_TIERS[S.plot].blocks;
const blocksUsed = (ignoreId) => S.rooms.reduce((a,r)=> a + (r.id===ignoreId ? 0 : ROOMS[r.type].w*hOf(r.type)), 0);
const count = t => S.rooms.filter(r=>r.type===t).length;
const cellsOf = r => ROOMS[r.type].w * hOf(r.type);
const decorCapacity = r => 12 * cellsOf(r);
function decorPoints(r){
  let p = 0;
  if(r.wall) p += 2*cellsOf(r);
  if(r.floor) p += 2*cellsOf(r);
  for(const it of (r.items||[])) p += ITEMS[it.id] ? ITEMS[it.id].decor : 0;
  for(const c of collectionBonus(r)) p += c.bonus;   // matching sets are worth more
  if(r.style) p += 2*cellsOf(r);                      // a themed room style counts as decor too
  return p;
}
// every piece of furniture adds coins to each guest's bill (matching sets add more), on top of the decor % bonus
function decorCoins(r){
  let c = 0; for(const it of (r.items||[])) c += ITEMS[it.id] ? ITEMS[it.id].decor * 0.6 : 0;
  for(const b of collectionBonus(r)) c += b.bonus * 0.6;
  if(r.style) c += 2*cellsOf(r);
  return Math.round(c);
}
const itemCoins = id => Math.max(1, Math.round((ITEMS[id] ? ITEMS[id].decor : 0) * 0.6));
const beautiful = r => ROOMS[r.type].kind==='guest' && decorPct(r) >= 1;   // fully decorated rooms earn 25% more and get tipped more
function decorPct(r){
  const k = ROOMS[r.type].kind;
  if(k==='service') return 0;
  return Math.min(1, decorPoints(r)/decorCapacity(r));
}
const hasBed = r => (r.items||[]).some(it=>ITEMS[it.id] && ITEMS[it.id].zone==='bed');

function level(){ let n=1; while(S.xp >= xpFor(n+1)) n++; return n; }
const isOpen = () => Date.now() < S.shiftEnd;
function stars(){
  const g = S.rooms.filter(r=>ROOMS[r.type].kind==='guest');
  const avgDecor = g.length ? g.reduce((a,r)=>a+decorPct(r),0)/g.length : 0;
  const types = new Set(S.rooms.filter(r=>ROOMS[r.type].kind==='amenity').map(r=>r.type)).size;
  const cleanable = S.rooms.filter(r=>ROOMS[r.type].kind==='guest');
  const clean = cleanable.length ? cleanable.filter(r=>!r.dirty).length/cleanable.length : 1;
  const lobby = lobbyRoom(), lobbyDecor = lobby ? decorPct(lobby) : 0;
  const score = 1 + 2.2*avgDecor + 1.4*Math.min(types,6)/6 + 1.0*S.sat + 0.8*clean + 0.6*lobbyDecor;
  const five = 1 + (score - 1) * 4/6;   // the 7-point score mapped onto 1-5 stars
  return Math.max(1, Math.min(MAX_STARS, Math.round(five*2)/2));

const ease = t => 1 - Math.pow(1-t, 3);

// which cells are taken, optionally pretending one room is gone and another is somewhere else
function occupancy(ignoreId, extra){
  const occ = new Set();
  for(const r of S.rooms){ if(r.id===ignoreId) continue; const d = ROOMS[r.type]; for(let i=0;i<d.w;i++) for(let j=0;j<hOf(r.type);j++) occ.add((r.f+j)+','+(r.c+i)); }
  if(extra){ const d = ROOMS[extra.type]; for(let i=0;i<d.w;i++) for(let j=0;j<hOf(extra.type);j++) occ.add((extra.f+j)+','+(extra.c+i)); }

function isSupported(type, f, c, occ){
  if(f===0) return true;
  // like the original: one block underneath is enough, the rest of a wide room can hang over the edge
  for(let i=0;i<ROOMS[type].w;i++) if(occ.has((f-1)+','+(c+i))) return true;

function strandsOthers(id, type, f, c){
  const extra = f===null ? null : {type, f, c};
  const occ = occupancy(id, extra);
  for(const r of S.rooms){ if(r.id===id) continue; if(!isSupported(r.type, r.f, r.c, occ)) return r; }

function placeProblem(type, f, c, ignoreId){
  const def = ROOMS[type], p = plot(), h = hOf(type);
  if(f<0 || c<0 || c+def.w>p.w || f+h>p.h) return "That's outside the building area";
  if(def.ground && f!==0) return `The ${def.name.toLowerCase()} has to be on the ground floor`;
  if(def.minFloor && f<def.minFloor) return `${def.name} needs to start on floor ${def.minFloor+1} or higher`;
  for(const r of S.rooms){
    if(r.id===ignoreId) continue;
    const o = ROOMS[r.type], oh = hOf(r.type);
    if(c < r.c+o.w && r.c < c+def.w && f < r.f+oh && r.f < f+h) return `That spot overlaps the ${o.name}`;
  }
  if(blocksUsed(ignoreId) + def.w*h > blocksMax()) return `Not enough blocks (${blocksUsed(ignoreId)}/${blocksMax()} used). Expand to get more.`;
  if(!isSupported(type, f, c, occupancy(ignoreId))) return 'Rooms need at least one block under them: the ground or another room';
  if(ignoreId!==undefined){ const s2 = strandsOthers(ignoreId, type, f, c); if(s2) return `The ${ROOMS[s2.type].name} above would have nothing to stand on`; }
  return null;

function furnishPlan(type, t){ return fillPlan(type, furnishPlanBase(type, t)); }
function furnishPlanBase(type, t){

      const p = {id, x: Math.round(i.x/2)}; if(d.zone==='wall') p.y = Math.round(i.y/2); out.push(p); }

  let left = 8;
  if(bed){ out.push({id:bed, x:8}); left = 8 + ITEMS[bed].w + 4; }
  const floors = ids.filter(id=>ITEMS[id].zone==='floor' && !ITEMS[id].back).sort((a,b)=>ITEMS[a].w-ITEMS[b].w);
  const fit = []; let used = 0; for(const id of floors){ if(left + used + ITEMS[id].w + 4 <= RW - 4){ fit.push(id); used += ITEMS[id].w + 4; } }
  const gap = fit.length ? Math.max(2, (RW - 4 - left - used + 4*fit.length) / (fit.length + 1)) : 0;
  let x = left + gap; for(const id of fit){ out.push({id, x:Math.round(x)}); x += ITEMS[id].w + gap; }

    room.forEach((id,i)=>{ if(tot + 8*room.length > RW && i > 0) return; const g = Math.max(4, (RW - tot) / (room.length + 1)); out.push({id, x:Math.round(g*(i+1) + cur), y}); cur += ITEMS[id].w; }); };

}
// top up a themed room so it never looks bare: a rug, wall art, a ceiling light and plants if there's room
function fillPlan(type, out){
  const kind = ROOMS[type].kind, RW = ROOMS[type].w*CELL, inSet = new Set(Object.values(COLLECTIONS).flat());
  const pool = Object.values(ITEMS).filter(d=>!inSet.has(d.id) && d.rooms.includes(kind) && d.zone!=='bed' && d.lvl <= 8).sort((a,b)=>a.cost-b.cost);
  const has = f => out.some(p=>f(ITEMS[p.id]));
  const floorSpans = () => out.filter(p=>(ITEMS[p.id].zone==='floor' || ITEMS[p.id].zone==='bed') && !ITEMS[p.id].back).map(p=>[p.x, p.x+ITEMS[p.id].w]);
  const freeAt = (x, w) => x >= 2 && x + w <= RW - 2 && floorSpans().every(([a,b])=>x+w <= a-2 || x >= b+2);
  const add = (d, x, y) => { if(!d) return; const p = {id:d.id, x:Math.round(x)}; if(y!==undefined) p.y = y; out.push(p); };
  if(!has(d=>d.back)){ const rug = pool.find(d=>d.back && d.w <= RW - 16); if(rug) add(rug, RW/2 - rug.w/2); }
  if(!has(d=>d.zone==='ceiling')){ const c = pool.find(d=>d.zone==='ceiling' && d.w <= RW - 10); if(c) add(c, RW/2 - c.w/2, 0); }
  const walls = out.filter(p=>ITEMS[p.id].zone==='wall').length;
  for(const w of pool.filter(d=>d.zone==='wall').slice(0, Math.max(0, (RW>=160?2:1) - walls))){
    const xs = [RW*0.76 - w.w/2, RW*0.28 - w.w/2]; const x = xs.find(x=>!out.some(p=>ITEMS[p.id].zone==='wall' && Math.abs(p.x - x) < w.w)); if(x!==undefined) add(w, x, 26); }
  for(const d of pool.filter(d=>d.zone==='floor' && !d.back && d.w <= 30)){   // small plants / side pieces in any gap
    if(out.length >= 8) break; for(const x of [RW - d.w - 4, 4, RW/2 - d.w/2]){ if(freeAt(x, d.w)){ add(d, x); break; } } }
  return out;
}

}

  html += card('auto', '🕒 Auto (follows the clock)', '🌗', 1);
  html += card(null, 'Classic city', '🏙️', 1);
  for(const sc of SCENES) html += card(sc.id, sc.name, art(sc.base) ? `<img src="${art(sc.base).src}" style="object-fit:cover;width:100%;height:100%">` : '🌄', sceneLvl(sc));
  html += `</div>`;
  if(WEATHER.length){
    html += `<h3>Weather</h3><div class="cat">`;
    const wc = (id, name, icon) => { const on = (S.weather||'auto')===id; return `<div class="bcard" style="${on?'border-color:#3fae8c;border-width:3px':''}" onclick="setWeather('${id}')"><div class="thumb" style="font-size:30px">${icon}</div><div class="nm">${name}</div><div class="ea">${on?'✓ In use':''}</div></div>`; };
    const WICON = {rain:'🌧️', drizzle:'🌦️', storm:'⛈️', snow:'❄️', sunny:'🌞', sun_rays:'🌞', fog:'🌫️', mist:'🌫️', wind:'🍃', leaves:'🍂', fireflies:'✨', petals:'🌸', rainbow:'🌈'};
    html += wc('auto','Changes by itself','🎲') + wc('clear','Clear','☀️') + WEATHER.map(w=>wc(w.id, w.name||w.id, WICON[w.id]||'🌦️')).join('');
    html += `</div>`;
  }
  showPanel(html, 'scenery');
}
function setWeather(id){ S.weather = id; weatherState.until = 0; save(); openScenery(); }
function setScene(id){ S.scene = id; save(); openScenery(); }

/* ---------------- daily bonus: come back each day, the reward grows for 7 days ---------------- */
const DAILY_REWARDS = [150, 250, 400, 600, 800, 1200, 2000];
function checkDaily(){
  if(!S.name) return;
  const d = new Date(), key = d.toDateString(), yest = new Date(d - 86400000).toDateString();
  S.daily = S.daily || {last:'', streak:0};
  if(S.daily.last === key) return;
  const streak = S.daily.last === yest ? (S.daily.streak % 7) + 1 : 1;
  const coins = Math.round(DAILY_REWARDS[streak-1] * (1 + 0.05*(level()-1)));
  S.daily = {last:key, streak}; S.coins += coins; save();
  const dots = DAILY_REWARDS.map((v,i)=>`<div style="flex:1;padding:6px 2px;border-radius:10px;font-size:11px;font-weight:800;background:${i<streak?'#ffc94d':'#f3ece2'};color:${i<streak?'#2b2340':'#9a8fa8'}">Day ${i+1}<br>${i===6?'🎁':'🪙'}</div>`).join('');
  modal(`<h2 style="margin:0 0 6px">🎁 Daily bonus</h2><div class="sub">Day ${streak} in a row! Come back tomorrow for more.</div>
    <div style="display:flex;gap:4px;margin:10px 0">${dots}</div>
    <div style="font-size:26px;font-weight:900;margin:6px 0">+🪙${coins.toLocaleString()}</div>
    <button class="btn" onclick="closeModal()">Collect</button>`);
  burstConfetti && burstConfetti();
}
function swapIcons(){ lastTop=''; document.querySelectorAll('[data-art]').forEach(el=>{ const a = art(el.dataset.art); if(a) el.innerHTML = `<img src="${a.src}" alt="">`; }); }
artReady.then(()=>{ swapIcons(); setTimeout(()=>{ if($('modal').style.display!=='flex') checkDaily(); }, 1200); const l = document.getElementById('loading'); if(l){ l.classList.add('done'); setTimeout(()=>l.remove(), 500); } });
setTimeout(swapIcons, 9000);
setInterval(()=>{ $('btnBuild').classList.toggle('on', ui.panelKind==='build'); }, 200);
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ save(); cloudSave(); onlineSave(); pushScores(true); }
  else if(onlineAvailable() && FB.user && online.synced && !online.asking && !ui.visit){ FB.getSave().then(d=>{ if(d && (d.savedAt||0) > online.known + 2000) offerNewerHotel(d); }).catch(()=>{}); } });
window.addEventListener('beforeunload', save);

/* ---------------- start ---------------- */
const hadSave = load();
checkPokeDay();
resize(); renderGoalsBox();
if(!S.name){
  // reuse the hotel name from earlier builds; only ask when there isn't one yet
  const prof = loadProfile();
  if(prof.name){ S.name = prof.name; save(); if(!hadSave) setTimeout(()=>toast(`🏨 New build ${BUILD}: ${S.name} starts fresh`), 400); }
  else askName();
}
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
initCloud();
</script>
