let loaded=0,failed=0,total=Object.keys(M).length,paused=false;
const stages=[],players=[];const assetHost=document.getElementById('assets');
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function progress(){document.getElementById('progress').textContent=`${loaded}/${total} assets checked`;document.getElementById('errors').textContent=failed?`${failed} asset checks failed`:'';}
function stage(w,h){const e=el('div','stage');e.style.width=w+'px';e.style.height=h+'px';stages.push(e);return e;}
function picture(key,w,h,report){const img=new Image();img.alt=key;img.onload=()=>{const ok=img.naturalWidth===w&&img.naturalHeight===h;if(report)report(ok,ok?`${w} x ${h}`:`Wrong size: ${img.naturalWidth} x ${img.naturalHeight}; expected ${w} x ${h}`);};img.onerror=()=>{if(report)report(false,'Missing or invalid image: '+M[key]);};img.src=M[key];return img;}
function card(key,count=true){const [w,h]=EXPECTED[key];const c=el('div','card');const box=stage(w,h);const status=el('div','status','Loading');c.append(box,el('div','label',key),status);box.append(picture(key,w,h,(ok,msg)=>{status.textContent=msg;if(!ok)c.classList.add('bad');if(count){loaded++;if(!ok)failed++;progress();}}));const item=ITEMS.get(key.slice(6));if(key.startsWith('decor/')&&item)c.append(el('div','meta',`${item.zone} | ${item.cost} coins | level ${item.level} | ${item.decor} decor`));return c;}
const grouped=new Map();
for(const key of Object.keys(M)){if(!EXPECTED[key])continue;let group=key.startsWith('rooms/treehouse_')?'Treehouse concepts':key.startsWith('rooms/')?(key.includes('_fx_')?'Room effect frames':'Rooms and theme styles'):key.startsWith('decor/')?'Furniture':key.startsWith('chars/')?(key.includes('_walk_')||key.includes('_sleep')||key.includes('_blink')||key.includes('_sweep')?'Character animation frames':'Characters'):key.startsWith('ui/')?'Buttons and HUD':key.startsWith('icons/')?'Thought icons':'Building';if(!grouped.has(group))grouped.set(group,[]);grouped.get(group).push(key);}
